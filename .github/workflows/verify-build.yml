name: Build Verification

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  GO_VERSION: '1.24'
  BUILD_ENV: dev

jobs:
  verify-build:
    name: Build ${{ matrix.os }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Linux Targets
          - os: linux
            goarch: amd64
          - os: linux
            goarch: arm64
          - os: linux
            goarch: arm
            goarm: 7
          - os: linux
            goarch: riscv64
          
          # macOS Targets
          - os: darwin
            goarch: arm64
          - os: darwin
            goarch: amd64

          # Windows Targets
          - os: windows
            goarch: amd64
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install Dependencies
        if: matrix.os == 'linux' && matrix.goarch != 'riscv64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential libssl-dev

      - name: Generate Code
        run: |
          # Mock generate or run generate if safe cross-platform
          # For simple CLI builds, we might skip deep generate steps if they require native C libraries for all arches
          go generate ./... || true

      - name: Build CLI
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0 # Default to pure Go for verification speed, unless CGO is strictly required for CLI
        run: |
          go build -trimpath -ldflags "-s -w -X main.Env=${BUILD_ENV}" -o omniedge-${{ matrix.os }}-${{ matrix.goarch }} ./cmd/edgecli

      - name: Verify Binary
        if: matrix.os == 'linux' && matrix.goarch == 'amd64'
        run: |
          ./omniedge-${{ matrix.os }}-${{ matrix.goarch }} version
