name: Connection Test

on:
  workflow_call:
    secrets:
      OMNIEDGE_SECRET_KEY:
        required: false
      OMNIEDGE_NETWORK_ID:
        required: false
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-beta.*'
      - 'v*.*.*-rc.*'

jobs:
  verify:
    name: Verify OmniEdge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build OmniEdge
        run: |
          sudo -E apt-get -y update
          sudo -E apt-get install -y openssl build-essential libssl-dev zip
          make generate
          BUILD_ENV=prod make build

      - name: Connection and Exit Node Simulation
        env:
          OMNIEDGE_SECRET_KEY: ${{ secrets.OMNIEDGE_SECRET_KEY }}
          OMNIEDGE_NETWORK_ID: ${{ secrets.OMNIEDGE_NETWORK_ID }}
        run: |
          if [ -z "$OMNIEDGE_SECRET_KEY" ]; then
            echo "Skipping test: OMNIEDGE_SECRET_KEY not configured"
            exit 1
          fi
          
          chmod +x ./out/omniedge
          sudo hostname Exit-Node-Host
          
          # 1. Login on Host
          ./out/omniedge login -s "$OMNIEDGE_SECRET_KEY"
          sleep 2
          
          # 2. Start Host as Exit Node
          echo "Starting OmniEdge as Exit Node on host..."
          sudo -E nohup ./out/omniedge join -n "$OMNIEDGE_NETWORK_ID" --as-exit-node > exitnode.log 2>&1 &
          
          # 3. Wait for Host IP
          echo "Waiting for Host IP..."
          EXIT_NODE_IP=""
          for i in {1..30}; do
            EXIT_NODE_IP=$(ip -4 addr show | grep -oE "100\.100\.[0-9]+\.[0-9]+" | head -n 1 || true)
            if [ ! -z "$EXIT_NODE_IP" ]; then break; fi
            sleep 2
          done
          
          if [ -z "$EXIT_NODE_IP" ]; then
            echo "Failed to start Exit Node on host"
            cat exitnode.log
            exit 1
          fi
          echo "Host Connected! IP: $EXIT_NODE_IP"
          echo "### Host Exit Node: Success ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Host IP**: $EXIT_NODE_IP" >> $GITHUB_STEP_SUMMARY

          # 4. Host Connectivity Check
          echo "Checking host connectivity..."
          if ping -c 4 -W 5 100.100.0.122; then
            echo "Host ping success!"
          else
            echo "Host ping failed!"
            cat exitnode.log
            exit 1
          fi

          # 5. Start Docker Client Simulation (Privileged for TAP support)
          docker run -d --name client-sim --hostname Client-Sim-Box \
            --privileged --cap-add NET_ADMIN --device /dev/net/tun \
            -v $(pwd)/out:/app \
            -e OMNIEDGE_SECRET_KEY="$OMNIEDGE_SECRET_KEY" \
            -e OMNIEDGE_NETWORK_ID="$OMNIEDGE_NETWORK_ID" \
            -e EXIT_NODE_IP="$EXIT_NODE_IP" \
            debian:stable-slim sleep infinity

          # 6. Setup Docker Client Environment
          docker exec client-sim sh -c "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y iproute2 iputils-ping ca-certificates"
          
          # Fix machine-id with a stable value to ensure identity consistency
          docker exec client-sim sh -c "echo 550e8400e29b41d4a716446655440000 > /etc/machine-id"
          
          # 7. Clean Login on Docker Client
          echo "Logging in on Docker Client..."
          docker exec client-sim /app/omniedge login -s "$OMNIEDGE_SECRET_KEY"
          
          echo "Starting Docker Client..."
          docker exec -d client-sim sh -c "/app/omniedge join -n $OMNIEDGE_NETWORK_ID -e $EXIT_NODE_IP > /app/client.log 2>&1"
          
          # 8. Verification Loop
          echo "Waiting for Client IP and Routing..."
          for i in {1..30}; do
            CLIENT_IP=$(docker exec client-sim ip -4 addr show | grep -oE "100\.100\.[0-9]+\.[0-9]+" | head -n 1 || true)
            ROUTE_CHECK=$(docker exec client-sim ip route show | grep default | grep "$EXIT_NODE_IP" || true)
            
            if [ ! -z "$CLIENT_IP" ] && [ "$CLIENT_IP" != "$EXIT_NODE_IP" ] && [ ! -z "$ROUTE_CHECK" ]; then
              echo "Client connected with unique IP: $CLIENT_IP"
              echo "### Exit Node Simulation: Success ✅" >> $GITHUB_STEP_SUMMARY
              echo "- **Exit Node Host**: $EXIT_NODE_IP" >> $GITHUB_STEP_SUMMARY
              echo "- **Client Container**: $CLIENT_IP" >> $GITHUB_STEP_SUMMARY
              
              if docker exec client-sim ping -c 4 -W 5 1.1.1.1; then
                echo "Internet access through tunnel: OK"
                exit 0
              else
                echo "Internet access through tunnel: FAILED"
                exit 1
              fi
            fi
            sleep 2
          done
          
          echo "Exit Node Simulation Failed or Timeout"
          echo "--- Client IP Status ---"
          docker exec client-sim ip addr show || true
          echo "--- Client Routing Table ---"
          docker exec client-sim ip route show || true
          echo "--- Client Logs ---"
          docker exec client-sim cat /app/client.log || true
          echo "--- Exit Node Host Logs ---"
          cat exitnode.log || true
          exit 1
