name: Connection Test

on:
  workflow_call:
    secrets:
      OMNIEDGE_SECRET_KEY:
        required: true
      OMNIEDGE_NETWORK_ID:
        required: true
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  test-connection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config build-essential iproute2 iputils-ping

      - name: Build OmniEdge
        run: |
          make generate
          BUILD_ENV=prod make build
          ls -l out/omniedge

      - name: Run Exit Node Simulation
        env:
          OMNIEDGE_SECRET_KEY: ${{ secrets.OMNIEDGE_SECRET_KEY || github.event.inputs.OMNIEDGE_SECRET_KEY }}
          OMNIEDGE_NETWORK_ID: ${{ secrets.OMNIEDGE_NETWORK_ID || github.event.inputs.OMNIEDGE_NETWORK_ID }}
        run: |
          if [ -z "$OMNIEDGE_SECRET_KEY" ]; then
            echo "Error: OMNIEDGE_SECRET_KEY is not set"
            exit 1
          fi
          
          chmod +x ./out/omniedge
          sudo hostname exit-node-host
          
          # 1. Start Host Exit Node
          echo "Starting Host Exit Node..."
          sudo -E ./out/omniedge join -n "$OMNIEDGE_NETWORK_ID" -s "$OMNIEDGE_SECRET_KEY" --as-exit-node > host.log 2>&1 &
          
          # 2. Wait for Host IP
          echo "Waiting for Host IP..."
          EXIT_NODE_IP=""
          for i in {1..30}; do
            EXIT_NODE_IP=$(ip -4 addr show | grep -oE "100\.100\.[0-9]+\.[0-9]+" | head -n 1 || true)
            if [ ! -z "$EXIT_NODE_IP" ]; then break; fi
            sleep 2
          done
          
          if [ -z "$EXIT_NODE_IP" ]; then
            echo "Failed to start Exit Node on host"
            cat host.log
            ip addr
            exit 1
          fi
          echo "Host Connected! IP: $EXIT_NODE_IP"
          echo "### Host Exit Node: Success ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Host IP**: $EXIT_NODE_IP" >> $GITHUB_STEP_SUMMARY

          # 3. Setup Docker Client Simulation
          docker run -d --name client-sim --hostname client-sim \
            --privileged --cap-add NET_ADMIN --device /dev/net/tun \
            -v $(pwd)/out:/app \
            debian:stable-slim sleep infinity

          docker exec client-sim sh -c "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y iproute2 iputils-ping ca-certificates"
          docker exec client-sim sh -c "echo 550e8400e29b41d4a716446655440000 > /etc/machine-id"
          docker exec client-sim sh -c "if [ ! -d /dev/net ]; then mkdir /dev/net; fi"
          docker exec client-sim sh -c "if [ ! -e /dev/net/tun ]; then mknod /dev/net/tun c 10 200; fi"

          # 4. Start Docker Client
          echo "Starting Docker Client..."
          docker exec -d client-sim sh -c "/app/omniedge join -n $OMNIEDGE_NETWORK_ID -s $OMNIEDGE_SECRET_KEY -e $EXIT_NODE_IP > /app/client.log 2>&1"

          # 5. Verify Client Connection
          echo "Waiting for Client IP..."
          CLIENT_IP=""
          for i in {1..20}; do
            CLIENT_IP=$(docker exec client-sim ip -4 addr show | grep -oE "100\.100\.[0-9]+\.[0-9]+" | head -n 1 || true)
            if [ ! -z "$CLIENT_IP" ]; then break; fi
            sleep 2
          done

          if [ -z "$CLIENT_IP" ]; then
            echo "Client failed to connect"
            docker exec client-sim cat /app/client.log
            exit 1
          fi
          echo "Client Connected! IP: $CLIENT_IP"

          # Allow stabilization for routing
          sleep 10
          
          # 6. Verify Internet Routing through Tunnel
          echo "Verifying internet access through tunnel..."
          if docker exec client-sim ping -c 4 -W 5 1.1.1.1; then
            echo "Internet access through tunnel: OK"
            echo "### Exit Node Simulation: Success ✅" >> $GITHUB_STEP_SUMMARY
            echo "- **Exit Node Host**: $EXIT_NODE_IP" >> $GITHUB_STEP_SUMMARY
            echo "- **Client Container**: $CLIENT_IP" >> $GITHUB_STEP_SUMMARY
          else
            echo "Internet access through tunnel: FAILED"
            echo "Debug Info:"
            docker exec client-sim ip route
            docker exec client-sim ip neighbor show
            docker exec client-sim ping -c 2 $EXIT_NODE_IP || echo "Cannot ping exit node!"
            docker exec client-sim cat /app/client.log
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: |
          docker rm -f client-sim || true
          sudo pkill omniedge || true
