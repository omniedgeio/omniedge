name: Connection Test

on:
  workflow_call:
    secrets:
      OMNIEDGE_SECRET_KEY:
        required: false
      OMNIEDGE_NETWORK_ID:
        required: false
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-beta.*'
      - 'v*.*.*-rc.*'

jobs:
  verify:
    name: Verify OmniEdge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build OmniEdge
        run: |
          sudo -E apt-get -y update
          sudo -E apt-get install -y openssl build-essential libssl-dev zip
          make generate
          BUILD_ENV=prod make build

      - name: Connection and Exit Node Simulation
        env:
          OMNIEDGE_SECRET_KEY: ${{ secrets.OMNIEDGE_SECRET_KEY }}
          OMNIEDGE_NETWORK_ID: ${{ secrets.OMNIEDGE_NETWORK_ID }}
        run: |
          if [ -z "$OMNIEDGE_SECRET_KEY" ]; then
            echo "Skipping test: OMNIEDGE_SECRET_KEY not configured"
            exit 1
          fi
          
          chmod +x ./out/omniedge
          
          # 1. Login on Host
          ./out/omniedge login -s "$OMNIEDGE_SECRET_KEY" -f auth.json
          sleep 2
          
          # 2. Start OmniEdge 
          echo "Starting OmniEdge Client..."
          sudo -E nohup ./out/omniedge join -n "$OMNIEDGE_NETWORK_ID" -e "100.100.0.122" -f auth.json > client.log 2>&1 &
          
          # 3. Wait for Local Virtual IP
          echo "Waiting for Host IP..."
          OmniEdge_IP=""
          for i in {1..30}; do
            # Filter out the exit node IP if it somehow appears in addr show
            OmniEdge_IP=$(ip -4 addr show | grep -oE "100\.100\.[0-9]+\.[0-9]+" | grep -v "100.100.0.122" | head -n 1 || true)
            if [ ! -z "$OmniEdge_IP" ]; then break; fi
            sleep 2
          done
          
          if [ -z "$OmniEdge_IP" ]; then
            echo "Failed to assigned Virtual IP on host"
            cat client.log
            exit 1
          fi
          echo "Host Connected! IP: $OmniEdge_IP"
          echo "### OmniEdge Client: Success ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Host IP**: $OmniEdge_IP" >> $GITHUB_STEP_SUMMARY
          echo "- **Exit Node**: 100.100.0.122" >> $GITHUB_STEP_SUMMARY

          # 4. Connectivity Check to Exit Node
          echo "Checking connectivity to Exit Node (100.100.0.122)..."
          if ping -c 4 -W 5 100.100.0.122; then
            echo "Exit node ping success!"
          else
            echo "Exit node ping failed!"
            cat client.log
            exit 1
          fi
          
          # 5. Internet Connectivity Check through Tunnel
          echo "Checking internet access through tunnel (ping 1.1.1.1)..."
          if ping -c 4 -W 5 1.1.1.1; then
            echo "Internet access through tunnel: OK"
            exit 0
          else
            echo "Internet access through tunnel: FAILED"
            exit 1
          fi

          echo "Exit Node Simulation Failed or Timeout"
          exit 1
