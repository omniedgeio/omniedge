name: "Test and Lint"

on:
  push:
    branches: [ main, dev, "refactor/*" ]
    tags:
      - 'v*.*.*'
      - 'v*.*.*-beta.*'
      - 'v*.*.*-rc.*'
  pull_request:
    branches: [ main, dev ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Cargo Check (exclude desktop)
        run: cargo check --workspace --exclude omniedge
      - name: Cargo Test (exclude desktop)
        run: cargo test --workspace --exclude omniedge

  lint:
    name: Rust Lint (Clippy & Fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Cargo Fmt
        run: cargo fmt --all -- --check
      - name: Cargo Clippy (exclude desktop)
        run: cargo clippy --workspace --exclude omniedge -- -D warnings
