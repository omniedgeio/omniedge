name: "OpenWrt Packages"

on:
  workflow_run:
    workflows: ["Release CLI"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g., 2.3.0)'
        required: true
        default: '2.3.0'

env:
  CARGO_TERM_COLOR: always
  PACKAGE_NAME: omniedge

jobs:
  # ===========================================================================
  # Build OpenWrt packages for all architectures
  # ===========================================================================
  build-openwrt:
    name: Build ${{ matrix.openwrt_arch }} (${{ matrix.pkg_format }})
    runs-on: ubuntu-latest
    # Only run if Release Desktop succeeded and was triggered by a tag, or if manually dispatched
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          # ===== x86_64 =====
          - rust_target: x86_64-unknown-linux-musl
            openwrt_arch: x86_64
            openwrt_version: "24.10.0"
            pkg_format: ipk
            use_cross: false
            
          - rust_target: x86_64-unknown-linux-musl
            openwrt_arch: x86_64
            openwrt_version: "snapshot"
            pkg_format: apk
            use_cross: false
            
          # ===== aarch64 (ARM64) - requires cross for proper musl linking =====
          - rust_target: aarch64-unknown-linux-musl
            openwrt_arch: aarch64_generic
            openwrt_version: "24.10.0"
            pkg_format: ipk
            use_cross: true
            
          - rust_target: aarch64-unknown-linux-musl
            openwrt_arch: aarch64_generic
            openwrt_version: "snapshot"
            pkg_format: apk
            use_cross: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            VERSION="${{ github.event.workflow_run.head_branch }}"
            VERSION="${VERSION#v}"  # Remove 'v' prefix
          else
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"  # Remove 'v' prefix
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target (non-cross builds)
        if: matrix.use_cross == false
        run: rustup target add ${{ matrix.rust_target }}

      - name: Install cross
        if: matrix.use_cross == true
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Install cross-compilation tools (non-cross builds)
        if: matrix.use_cross == false
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools musl-dev
          
          # Install architecture-specific toolchains
          case "${{ matrix.rust_target }}" in
            "aarch64-unknown-linux-musl")
              sudo apt-get install -y gcc-aarch64-linux-gnu
              ;;
          esac

      - name: Configure Cargo for cross-compilation (non-cross builds)
        if: matrix.use_cross == false
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml << 'EOF'
          [target.x86_64-unknown-linux-musl]
          linker = "musl-gcc"
          
          [target.aarch64-unknown-linux-musl]
          linker = "aarch64-linux-gnu-gcc"
          rustflags = ["-C", "target-feature=+crt-static"]
          EOF

      - name: Build omniedge-cli (native)
        if: matrix.use_cross == false
        run: |
          cargo build --release -p omniedge-cli --target ${{ matrix.rust_target }}

      - name: Build omniedge-cli (cross)
        if: matrix.use_cross == true
        run: |
          cross build --release -p omniedge-cli --target ${{ matrix.rust_target }}

      - name: Strip binary
        run: |
          # Strip binary to reduce size
          case "${{ matrix.rust_target }}" in
            "x86_64-unknown-linux-musl")
              strip target/${{ matrix.rust_target }}/release/omniedge
              ;;
            "aarch64-unknown-linux-musl")
              sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu
              aarch64-linux-gnu-strip target/${{ matrix.rust_target }}/release/omniedge || true
              ;;
          esac
          
          # Show binary info
          file target/${{ matrix.rust_target }}/release/omniedge
          ls -lh target/${{ matrix.rust_target }}/release/omniedge

      - name: Create IPK package
        if: matrix.pkg_format == 'ipk'
        run: |
          PKG_VERSION="${{ steps.version.outputs.version }}"
          PKG_ARCH="${{ matrix.openwrt_arch }}"
          BINARY="target/${{ matrix.rust_target }}/release/omniedge"
          
          # Create package directory structure
          PKG_DIR="omniedge_${PKG_VERSION}_${PKG_ARCH}"
          mkdir -p "${PKG_DIR}/data/usr/bin"
          mkdir -p "${PKG_DIR}/data/etc/init.d"
          mkdir -p "${PKG_DIR}/data/etc/config"
          mkdir -p "${PKG_DIR}/control"
          
          # Copy binary
          cp "${BINARY}" "${PKG_DIR}/data/usr/bin/omniedge"
          chmod 755 "${PKG_DIR}/data/usr/bin/omniedge"
          
          # Copy init script if exists
          if [ -f "openwrt/files/omniedge.init" ]; then
            cp openwrt/files/omniedge.init "${PKG_DIR}/data/etc/init.d/omniedge"
            chmod 755 "${PKG_DIR}/data/etc/init.d/omniedge"
          fi
          
          # Copy config if exists
          if [ -f "openwrt/files/omniedge.config" ]; then
            cp openwrt/files/omniedge.config "${PKG_DIR}/data/etc/config/omniedge"
          fi
          
          # Calculate installed size
          INSTALLED_SIZE=$(du -sb "${PKG_DIR}/data" | cut -f1)
          
          # Create control file
          cat > "${PKG_DIR}/control/control" << EOF
          Package: omniedge
          Version: ${PKG_VERSION}
          Depends: libc, kmod-tun
          Source: https://github.com/omniedgeio/omniedge
          Section: net
          SourceName: omniedge
          License: Apache-2.0 OR MIT
          Architecture: ${PKG_ARCH}
          Installed-Size: ${INSTALLED_SIZE}
          Maintainer: OmniEdge Team <support@omniedge.io>
          Description: OmniEdge - Peer-to-peer VPN for edge computing
           A secure, peer-to-peer mesh VPN solution for connecting devices
           across networks with minimal latency and maximum security.
          EOF
          
          # Create postinst script
          cat > "${PKG_DIR}/control/postinst" << 'EOF'
          #!/bin/sh
          [ -x /etc/init.d/omniedge ] && /etc/init.d/omniedge enable
          exit 0
          EOF
          chmod 755 "${PKG_DIR}/control/postinst"
          
          # Create prerm script
          cat > "${PKG_DIR}/control/prerm" << 'EOF'
          #!/bin/sh
          [ -x /etc/init.d/omniedge ] && /etc/init.d/omniedge disable
          [ -x /etc/init.d/omniedge ] && /etc/init.d/omniedge stop
          exit 0
          EOF
          chmod 755 "${PKG_DIR}/control/prerm"
          
          # Create conffiles
          echo "/etc/config/omniedge" > "${PKG_DIR}/control/conffiles"
          
          # Build IPK package
          cd "${PKG_DIR}/control"
          tar --numeric-owner --group=0 --owner=0 -czf ../control.tar.gz .
          cd ../data
          tar --numeric-owner --group=0 --owner=0 -czf ../data.tar.gz .
          cd ..
          echo "2.0" > debian-binary
          tar --numeric-owner --group=0 --owner=0 -czf "../omniedge_${PKG_VERSION}_${PKG_ARCH}.ipk" \
            ./debian-binary ./control.tar.gz ./data.tar.gz
          cd ..
          
          # Verify package
          ls -lh "omniedge_${PKG_VERSION}_${PKG_ARCH}.ipk"

      - name: Create APK package
        if: matrix.pkg_format == 'apk'
        run: |
          PKG_VERSION="${{ steps.version.outputs.version }}"
          PKG_ARCH="${{ matrix.openwrt_arch }}"
          BINARY="target/${{ matrix.rust_target }}/release/omniedge"
          
          # Create package directory structure
          PKG_DIR="omniedge-${PKG_VERSION}"
          mkdir -p "${PKG_DIR}/usr/bin"
          mkdir -p "${PKG_DIR}/etc/init.d"
          mkdir -p "${PKG_DIR}/etc/config"
          
          # Copy binary
          cp "${BINARY}" "${PKG_DIR}/usr/bin/omniedge"
          chmod 755 "${PKG_DIR}/usr/bin/omniedge"
          
          # Copy init script if exists
          if [ -f "openwrt/files/omniedge.init" ]; then
            cp openwrt/files/omniedge.init "${PKG_DIR}/etc/init.d/omniedge"
            chmod 755 "${PKG_DIR}/etc/init.d/omniedge"
          fi
          
          # Copy config if exists
          if [ -f "openwrt/files/omniedge.config" ]; then
            cp openwrt/files/omniedge.config "${PKG_DIR}/etc/config/omniedge"
          fi
          
          # Create .PKGINFO for APK
          cat > "${PKG_DIR}/.PKGINFO" << EOF
          pkgname = omniedge
          pkgver = ${PKG_VERSION}-r1
          pkgdesc = OmniEdge - Peer-to-peer VPN for edge computing
          url = https://omniedge.io
          builddate = $(date +%s)
          packager = OmniEdge Team <support@omniedge.io>
          size = $(du -sb "${PKG_DIR}/usr/bin/omniedge" | cut -f1)
          arch = ${PKG_ARCH}
          license = Apache-2.0 OR MIT
          depend = kmod-tun
          EOF
          
          # Create the APK tarball (unsigned, for manual installation)
          cd "${PKG_DIR}"
          tar -czf "../omniedge-${PKG_VERSION}-r1-${PKG_ARCH}.apk" \
            .PKGINFO usr etc 2>/dev/null || \
          tar -czf "../omniedge-${PKG_VERSION}-r1-${PKG_ARCH}.apk" \
            .PKGINFO usr
          cd ..
          
          # Verify package
          ls -lh "omniedge-${PKG_VERSION}-r1-${PKG_ARCH}.apk"

      - name: Upload IPK artifact
        if: matrix.pkg_format == 'ipk'
        uses: actions/upload-artifact@v4
        with:
          name: omniedge-${{ steps.version.outputs.version }}-openwrt-${{ matrix.openwrt_version }}-${{ matrix.openwrt_arch }}-ipk
          path: "*.ipk"

      - name: Upload APK artifact
        if: matrix.pkg_format == 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: omniedge-${{ steps.version.outputs.version }}-openwrt-${{ matrix.openwrt_version }}-${{ matrix.openwrt_arch }}-apk
          path: "*.apk"

  # ===========================================================================
  # Publish to GitHub Release
  # ===========================================================================
  publish-release:
    name: Publish to Release
    runs-on: ubuntu-latest
    needs: [build-openwrt]
    steps:
      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "workflow_run" ]; then
            VERSION="${{ github.event.workflow_run.head_branch }}"
            VERSION="${VERSION#v}"  # Remove 'v' prefix
          else
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Prepare release files
        run: |
          mkdir -p release
          find artifacts -name "*.ipk" -exec cp {} release/ \;
          find artifacts -name "*.apk" -exec cp {} release/ \;
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: release/*
          file_glob: true
          tag: ${{ steps.version.outputs.tag }}
          overwrite: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          release_name: "omniedge ${{ steps.version.outputs.tag }}"
          body: |
            ## omniedge ${{ steps.version.outputs.tag }}
            
            ### OpenWrt Packages
            
            #### IPK Packages (OpenWrt 24.10.x and earlier)
            Install with: `opkg install omniedge_*.ipk`
            
            | Architecture | Description |
            |--------------|-------------|
            | x86_64 | PC/VM routers, x86-based devices |
            | aarch64_generic | ARM64 routers (MediaTek Filogic, Qualcomm) |
            | mipsel_24kc | MIPS LE routers (Ramips MT7621, Xiaomi) |
            | mips_24kc | MIPS BE routers (Atheros, TP-Link Archer) |
            
            #### APK Packages (OpenWrt 25.x and later)
            Install with: `apk add --allow-untrusted omniedge-*.apk`
            
            ### Installation
            
            ```bash
            # Download package for your architecture
            wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/omniedge_${{ steps.version.outputs.version }}_<arch>.ipk
            
            # Install (IPK)
            opkg install omniedge_${{ steps.version.outputs.version }}_<arch>.ipk
            
            # Or install (APK)
            apk add --allow-untrusted omniedge-${{ steps.version.outputs.version }}-r1-<arch>.apk
            
            # Configure
            uci set omniedge.omniedge.enabled=1
            uci set omniedge.omniedge.network_id='<your-network-id>'
            uci set omniedge.omniedge.secret_key='<your-secret-key>'
            uci commit omniedge
            
            # Start service
            /etc/init.d/omniedge start
            ```
