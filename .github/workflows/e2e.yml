name: "E2E Tests"

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  e2e-nucleus:
    name: Nucleus Server E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build E2E test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: tests/e2e/Dockerfile
          push: false
          load: true
          tags: omniedge-e2e-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create test network
        run: |
          docker network create --subnet=172.30.0.0/24 omniedge-e2e-net

      - name: Start nucleus server
        run: |
          docker run -d \
            --name nucleus \
            --network omniedge-e2e-net \
            --ip 172.30.0.2 \
            omniedge-e2e-test:latest \
            start --mode nucleus --port 51821 --secret "e2e-test-secret-min16chars" --daemon
          
          # Wait for startup
          sleep 5

      - name: Verify nucleus is running
        run: |
          echo "==> Checking process..."
          docker exec nucleus pgrep -x omniedge
          
          echo "==> Checking UDP listener..."
          docker exec nucleus ss -uln | grep :51821
          
          echo "==> Server logs:"
          docker logs nucleus

      - name: Test UDP connectivity
        run: |
          # Run a temporary container to test UDP connectivity (override entrypoint to use shell)
          docker run --rm \
            --network omniedge-e2e-net \
            --entrypoint sh \
            omniedge-e2e-test:latest \
            -c "echo 'ping' | nc -u -w 1 172.30.0.2 51821 || true"
          
          echo "==> Nucleus logs after UDP test:"
          docker logs nucleus 2>&1 | tail -10

      - name: Test nucleus without secret (warning mode)
        run: |
          docker run -d \
            --name nucleus-no-secret \
            --network omniedge-e2e-net \
            --ip 172.30.0.10 \
            omniedge-e2e-test:latest \
            start --mode nucleus --port 51822 --daemon
          
          sleep 3
          
          echo "==> Logs should show warning about no authentication:"
          docker logs nucleus-no-secret 2>&1 | head -20
          
          # Verify it started despite no secret
          docker exec nucleus-no-secret pgrep -x omniedge

      - name: Cleanup
        if: always()
        run: |
          docker rm -f nucleus nucleus-no-secret 2>/dev/null || true
          docker network rm omniedge-e2e-net 2>/dev/null || true

  e2e-signaling:
    name: Signaling Protocol E2E
    runs-on: ubuntu-latest
    needs: e2e-nucleus
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build E2E test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: tests/e2e/Dockerfile
          push: false
          load: true
          tags: omniedge-e2e-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create test network
        run: |
          docker network create --subnet=172.30.0.0/24 omniedge-e2e-net

      - name: Start nucleus and simulate peer registration
        run: |
          # Start nucleus
          docker run -d \
            --name nucleus \
            --network omniedge-e2e-net \
            --ip 172.30.0.2 \
            omniedge-e2e-test:latest \
            start --mode nucleus --port 51821 --secret "e2e-test-secret-min16chars" --daemon
          
          sleep 5
          
          # The nucleus should be ready to accept signaling messages
          echo "==> Nucleus ready for signaling"
          docker logs nucleus

      - name: Cleanup
        if: always()
        run: |
          docker rm -f nucleus 2>/dev/null || true
          docker network rm omniedge-e2e-net 2>/dev/null || true

  e2e-full-tunnel:
    name: Full P2P Tunnel E2E (Privileged)
    runs-on: ubuntu-latest
    needs: e2e-signaling
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build E2E test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: tests/e2e/Dockerfile
          push: false
          load: true
          tags: omniedge-e2e-test:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Enable TUN module
        run: |
          sudo modprobe tun
          ls -la /dev/net/tun

      - name: Create test network
        run: |
          docker network create --subnet=172.30.0.0/24 omniedge-e2e-net

      - name: Start nucleus server (dual mode simulation)
        run: |
          # For full tunnel test, we need privileged mode for TUN
          docker run -d \
            --name nucleus \
            --network omniedge-e2e-net \
            --ip 172.30.0.2 \
            --privileged \
            --device /dev/net/tun:/dev/net/tun \
            omniedge-e2e-test:latest \
            start --mode nucleus --port 51821 --secret "e2e-test-secret-min16chars" --daemon
          
          sleep 5
          docker logs nucleus

      - name: Verify TUN capability
        run: |
          # Check if TUN device is accessible in privileged container
          docker exec nucleus ls -la /dev/net/tun || echo "TUN device check"
          
          echo "==> Full tunnel E2E test infrastructure ready"
          echo "    Note: Actual P2P tunnel requires authenticated join flow"
          echo "    which needs a mock backend or test credentials"

      - name: Cleanup
        if: always()
        run: |
          docker rm -f nucleus 2>/dev/null || true
          docker network rm omniedge-e2e-net 2>/dev/null || true
