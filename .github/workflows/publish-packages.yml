name: "Publish Packages"

# This workflow publishes packages to various package managers
# It runs after the main release workflow completes successfully

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 2.0.0)'
        required: true
        type: string

env:
  VERSION: ${{ github.event.inputs.version || github.event.workflow_run.head_branch }}

jobs:
  # ===========================================================================
  # Prepare - Get version and download release assets
  # ===========================================================================
  prepare:
    name: Prepare Release Info
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      cli_sha256_linux_x64: ${{ steps.checksums.outputs.cli_linux_x64 }}
      cli_sha256_linux_arm64: ${{ steps.checksums.outputs.cli_linux_arm64 }}
      cli_sha256_macos_x64: ${{ steps.checksums.outputs.cli_macos_x64 }}
      cli_sha256_macos_arm64: ${{ steps.checksums.outputs.cli_macos_arm64 }}
      cli_sha256_windows_x64: ${{ steps.checksums.outputs.cli_windows_x64 }}
      desktop_sha256_macos_x64: ${{ steps.checksums.outputs.desktop_macos_x64 }}
      desktop_sha256_macos_arm64: ${{ steps.checksums.outputs.desktop_macos_arm64 }}
      desktop_sha256_windows_msi: ${{ steps.checksums.outputs.desktop_windows_msi }}
    steps:
      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${{ github.event.workflow_run.head_branch }}"
            VERSION="${VERSION#v}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Download and compute checksums
        id: checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}"
          
          # Function to get SHA256
          get_sha256() {
            local url="$1"
            local name="$2"
            if curl -fsSL -o "$name" "$url" 2>/dev/null; then
              sha256sum "$name" | cut -d' ' -f1
            else
              echo "PLACEHOLDER_SHA256"
            fi
          }
          
          # CLI checksums
          echo "cli_linux_x64=$(get_sha256 "${BASE_URL}/omniedge-cli-${VERSION}-linux-x64.tar.gz" "cli-linux-x64.tar.gz")" >> $GITHUB_OUTPUT
          echo "cli_linux_arm64=$(get_sha256 "${BASE_URL}/omniedge-cli-${VERSION}-linux-arm64.tar.gz" "cli-linux-arm64.tar.gz")" >> $GITHUB_OUTPUT
          echo "cli_macos_x64=$(get_sha256 "${BASE_URL}/omniedge-cli-${VERSION}-macos-x64.tar.gz" "cli-macos-x64.tar.gz")" >> $GITHUB_OUTPUT
          echo "cli_macos_arm64=$(get_sha256 "${BASE_URL}/omniedge-cli-${VERSION}-macos-arm64.tar.gz" "cli-macos-arm64.tar.gz")" >> $GITHUB_OUTPUT
          echo "cli_windows_x64=$(get_sha256 "${BASE_URL}/omniedge-cli-${VERSION}-windows-x64.zip" "cli-windows-x64.zip")" >> $GITHUB_OUTPUT
          
          # Desktop checksums
          echo "desktop_macos_x64=$(get_sha256 "${BASE_URL}/omniedge-desktop-${VERSION}-macos-x64.dmg" "desktop-macos-x64.dmg")" >> $GITHUB_OUTPUT
          echo "desktop_macos_arm64=$(get_sha256 "${BASE_URL}/omniedge-desktop-${VERSION}-macos-arm64.dmg" "desktop-macos-arm64.dmg")" >> $GITHUB_OUTPUT
          echo "desktop_windows_msi=$(get_sha256 "${BASE_URL}/omniedge-desktop-${VERSION}-windows-x64.msi" "desktop-windows-msi.msi")" >> $GITHUB_OUTPUT

  # ===========================================================================
  # Publish to Homebrew Tap
  # ===========================================================================
  homebrew:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4

      - name: Update Homebrew Formula
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA256_MACOS_ARM64: ${{ needs.prepare.outputs.cli_sha256_macos_arm64 }}
          SHA256_MACOS_X64: ${{ needs.prepare.outputs.cli_sha256_macos_x64 }}
          SHA256_LINUX_ARM64: ${{ needs.prepare.outputs.cli_sha256_linux_arm64 }}
          SHA256_LINUX_X64: ${{ needs.prepare.outputs.cli_sha256_linux_x64 }}
        run: |
          # Update version and checksums in formula
          sed -i "s/version \".*\"/version \"${VERSION}\"/" packaging/homebrew/Formula/omniedge-cli.rb
          sed -i "s/PLACEHOLDER_SHA256_MACOS_ARM64/${SHA256_MACOS_ARM64}/" packaging/homebrew/Formula/omniedge-cli.rb
          sed -i "s/PLACEHOLDER_SHA256_MACOS_X64/${SHA256_MACOS_X64}/" packaging/homebrew/Formula/omniedge-cli.rb
          sed -i "s/PLACEHOLDER_SHA256_LINUX_ARM64/${SHA256_LINUX_ARM64}/" packaging/homebrew/Formula/omniedge-cli.rb
          sed -i "s/PLACEHOLDER_SHA256_LINUX_X64/${SHA256_LINUX_X64}/" packaging/homebrew/Formula/omniedge-cli.rb
          
          echo "Updated formula for version ${VERSION}"
          cat packaging/homebrew/Formula/omniedge-cli.rb

      - name: Push to Homebrew Tap
        if: ${{ vars.HOMEBREW_TAP_REPO != '' }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          # Clone the tap repository and update
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${{ vars.HOMEBREW_TAP_REPO }}.git" tap
          cp packaging/homebrew/Formula/*.rb tap/Formula/
          cp packaging/homebrew/Casks/*.rb tap/Casks/ 2>/dev/null || true
          cd tap
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Update to version ${{ needs.prepare.outputs.version }}" || echo "No changes to commit"
          git push

  # ===========================================================================
  # Publish to AUR
  # ===========================================================================
  aur:
    name: Update AUR
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4

      - name: Update PKGBUILD
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA256_X64: ${{ needs.prepare.outputs.cli_sha256_linux_x64 }}
          SHA256_ARM64: ${{ needs.prepare.outputs.cli_sha256_linux_arm64 }}
        run: |
          cd packaging/aur/omniedge-cli-bin
          sed -i "s/pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i "s/PLACEHOLDER_SHA256_X64/${SHA256_X64}/" PKGBUILD
          sed -i "s/PLACEHOLDER_SHA256_ARM64/${SHA256_ARM64}/" PKGBUILD
          
          echo "Updated PKGBUILD:"
          cat PKGBUILD

      - name: Publish to AUR
        if: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
        uses: KSXGitHub/github-actions-deploy-aur@v2
        with:
          pkgname: omniedge-cli-bin
          pkgbuild: packaging/aur/omniedge-cli-bin/PKGBUILD
          commit_username: GitHub Actions
          commit_email: actions@github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to version ${{ needs.prepare.outputs.version }}"

  # ===========================================================================
  # Publish to Snap Store
  # ===========================================================================
  snap:
    name: Publish to Snap Store
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4

      - name: Update snapcraft.yaml version
        run: |
          sed -i "s/version: .*/version: '${{ needs.prepare.outputs.version }}'/" packaging/snap/snapcraft.yaml

      - name: Build Snap
        uses: snapcore/action-build@v1
        id: build
        with:
          path: packaging/snap

      - name: Publish to Snap Store
        if: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS != '' }}
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable

  # ===========================================================================
  # Publish to Winget
  # ===========================================================================
  winget:
    name: Update Winget
    runs-on: windows-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4

      - name: Update Winget Manifests
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA256_CLI: ${{ needs.prepare.outputs.cli_sha256_windows_x64 }}
          SHA256_DESKTOP: ${{ needs.prepare.outputs.desktop_sha256_windows_msi }}
        run: |
          # Update CLI manifest
          $cliInstaller = Get-Content "packaging/winget/omniedge-cli/OmniEdge.OmniEdgeCLI.installer.yaml" -Raw
          $cliInstaller = $cliInstaller -replace "PackageVersion: .*", "PackageVersion: $env:VERSION"
          $cliInstaller = $cliInstaller -replace "PLACEHOLDER_SHA256", "$env:SHA256_CLI"
          $cliInstaller = $cliInstaller -replace "v2\.0\.0", "v$env:VERSION"
          $cliInstaller = $cliInstaller -replace "2\.0\.0", "$env:VERSION"
          Set-Content "packaging/winget/omniedge-cli/OmniEdge.OmniEdgeCLI.installer.yaml" $cliInstaller
          
          # Update Desktop manifest
          $desktopInstaller = Get-Content "packaging/winget/omniedge-desktop/OmniEdge.OmniEdgeDesktop.installer.yaml" -Raw
          $desktopInstaller = $desktopInstaller -replace "PackageVersion: .*", "PackageVersion: $env:VERSION"
          $desktopInstaller = $desktopInstaller -replace "PLACEHOLDER_SHA256_MSI", "$env:SHA256_DESKTOP"
          $desktopInstaller = $desktopInstaller -replace "v2\.0\.0", "v$env:VERSION"
          $desktopInstaller = $desktopInstaller -replace "2\.0\.0", "$env:VERSION"
          Set-Content "packaging/winget/omniedge-desktop/OmniEdge.OmniEdgeDesktop.installer.yaml" $desktopInstaller

      - name: Submit to Winget
        if: ${{ secrets.WINGET_TOKEN != '' }}
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: OmniEdge.OmniEdgeCLI
          version: ${{ needs.prepare.outputs.version }}
          installers-regex: '\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}

  # ===========================================================================
  # Publish to Chocolatey
  # ===========================================================================
  chocolatey:
    name: Publish to Chocolatey
    runs-on: windows-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4

      - name: Update Chocolatey Packages
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA256_CLI: ${{ needs.prepare.outputs.cli_sha256_windows_x64 }}
          SHA256_DESKTOP: ${{ needs.prepare.outputs.desktop_sha256_windows_msi }}
        run: |
          # Update CLI package
          $nuspec = Get-Content "packaging/chocolatey/omniedge-cli/omniedge-cli.nuspec" -Raw
          $nuspec = $nuspec -replace "<version>.*</version>", "<version>$env:VERSION</version>"
          $nuspec = $nuspec -replace "v2\.0\.0", "v$env:VERSION"
          Set-Content "packaging/chocolatey/omniedge-cli/omniedge-cli.nuspec" $nuspec
          
          $install = Get-Content "packaging/chocolatey/omniedge-cli/tools/chocolateyInstall.ps1" -Raw
          $install = $install -replace "\`$version = '.*'", "`$version = '$env:VERSION'"
          $install = $install -replace "PLACEHOLDER_SHA256", "$env:SHA256_CLI"
          Set-Content "packaging/chocolatey/omniedge-cli/tools/chocolateyInstall.ps1" $install
          
          # Update Desktop package
          $nuspec = Get-Content "packaging/chocolatey/omniedge-desktop/omniedge-desktop.nuspec" -Raw
          $nuspec = $nuspec -replace "<version>.*</version>", "<version>$env:VERSION</version>"
          $nuspec = $nuspec -replace "v2\.0\.0", "v$env:VERSION"
          Set-Content "packaging/chocolatey/omniedge-desktop/omniedge-desktop.nuspec" $nuspec
          
          $install = Get-Content "packaging/chocolatey/omniedge-desktop/tools/chocolateyInstall.ps1" -Raw
          $install = $install -replace "\`$version = '.*'", "`$version = '$env:VERSION'"
          $install = $install -replace "PLACEHOLDER_SHA256", "$env:SHA256_DESKTOP"
          Set-Content "packaging/chocolatey/omniedge-desktop/tools/chocolateyInstall.ps1" $install

      - name: Build and Push CLI Package
        if: ${{ secrets.CHOCOLATEY_API_KEY != '' }}
        shell: pwsh
        run: |
          cd packaging/chocolatey/omniedge-cli
          choco pack
          choco push omniedge-cli.${{ needs.prepare.outputs.version }}.nupkg --source https://push.chocolatey.org/ --api-key ${{ secrets.CHOCOLATEY_API_KEY }}

      - name: Build and Push Desktop Package
        if: ${{ secrets.CHOCOLATEY_API_KEY != '' }}
        shell: pwsh
        run: |
          cd packaging/chocolatey/omniedge-desktop
          choco pack
          choco push omniedge-desktop.${{ needs.prepare.outputs.version }}.nupkg --source https://push.chocolatey.org/ --api-key ${{ secrets.CHOCOLATEY_API_KEY }}
