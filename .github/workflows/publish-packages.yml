name: "Publish Packages"

# This workflow publishes packages to various package managers
# It runs after the main release workflows complete successfully

on:
  workflow_run:
    workflows: ["Release CLI", "Release Desktop"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 2.3.0)'
        required: true
        type: string

jobs:
  # ===========================================================================
  # Prepare - Get version and download release assets
  # ===========================================================================
  prepare:
    name: Prepare Release Info
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      cli_sha256_linux_x64: ${{ steps.checksums.outputs.cli_linux_x64 }}
      cli_sha256_linux_arm64: ${{ steps.checksums.outputs.cli_linux_arm64 }}
      cli_sha256_macos_x64: ${{ steps.checksums.outputs.cli_macos_x64 }}
      cli_sha256_macos_arm64: ${{ steps.checksums.outputs.cli_macos_arm64 }}
      cli_sha256_windows_x64: ${{ steps.checksums.outputs.cli_windows_x64 }}
      desktop_sha256_macos_x64: ${{ steps.checksums.outputs.desktop_macos_x64 }}
      desktop_sha256_macos_arm64: ${{ steps.checksums.outputs.desktop_macos_arm64 }}
      desktop_sha256_windows_msi: ${{ steps.checksums.outputs.desktop_windows_msi }}
    steps:
      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            # Manual dispatch - version provided directly
            VERSION="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.event.workflow_run.head_branch }}" ]; then
            # Triggered by workflow_run - extract from tag
            VERSION="${{ github.event.workflow_run.head_branch }}"
            VERSION="${VERSION#v}"  # Remove 'v' prefix if present
          else
            echo "ERROR: Could not determine version"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Download and compute checksums
        id: checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}"
          
          # Function to get SHA256
          get_sha256() {
            local url="$1"
            local name="$2"
            if curl -fsSL -o "$name" "$url" 2>/dev/null; then
              sha256sum "$name" | cut -d' ' -f1
            else
              echo "PLACEHOLDER_SHA256"
            fi
          }
          
          # CLI checksums
          echo "cli_linux_x64=$(get_sha256 "${BASE_URL}/omniedge-cli-${VERSION}-linux-x64.tar.gz" "cli-linux-x64.tar.gz")" >> $GITHUB_OUTPUT
          echo "cli_linux_arm64=$(get_sha256 "${BASE_URL}/omniedge-cli-${VERSION}-linux-arm64.tar.gz" "cli-linux-arm64.tar.gz")" >> $GITHUB_OUTPUT
          echo "cli_macos_x64=$(get_sha256 "${BASE_URL}/omniedge-cli-${VERSION}-macos-x64.tar.gz" "cli-macos-x64.tar.gz")" >> $GITHUB_OUTPUT
          echo "cli_macos_arm64=$(get_sha256 "${BASE_URL}/omniedge-cli-${VERSION}-macos-arm64.tar.gz" "cli-macos-arm64.tar.gz")" >> $GITHUB_OUTPUT
          echo "cli_windows_x64=$(get_sha256 "${BASE_URL}/omniedge-cli-${VERSION}-windows-x64.zip" "cli-windows-x64.zip")" >> $GITHUB_OUTPUT
          
          # Desktop checksums
          echo "desktop_macos_x64=$(get_sha256 "${BASE_URL}/omniedge-desktop-${VERSION}-macos-x64.dmg" "desktop-macos-x64.dmg")" >> $GITHUB_OUTPUT
          echo "desktop_macos_arm64=$(get_sha256 "${BASE_URL}/omniedge-desktop-${VERSION}-macos-arm64.dmg" "desktop-macos-arm64.dmg")" >> $GITHUB_OUTPUT
          echo "desktop_windows_msi=$(get_sha256 "${BASE_URL}/omniedge-desktop-${VERSION}-windows-x64.msi" "desktop-windows-msi.msi")" >> $GITHUB_OUTPUT

  # ===========================================================================
  # Publish to Homebrew Tap (Formula for CLI, Cask for Desktop)
  # ===========================================================================
  homebrew:
    name: Update Homebrew Tap
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4

      - name: Update Homebrew Formula (CLI)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA256_MACOS_ARM64: ${{ needs.prepare.outputs.cli_sha256_macos_arm64 }}
          SHA256_MACOS_X64: ${{ needs.prepare.outputs.cli_sha256_macos_x64 }}
          SHA256_LINUX_ARM64: ${{ needs.prepare.outputs.cli_sha256_linux_arm64 }}
          SHA256_LINUX_X64: ${{ needs.prepare.outputs.cli_sha256_linux_x64 }}
        run: |
          FORMULA="packaging/homebrew/Formula/omniedge-cli.rb"
          
          # Update version
          sed -i "s/version \".*\"/version \"${VERSION}\"/" "$FORMULA"
          
          # Update checksums
          sed -i "s/PLACEHOLDER_SHA256_MACOS_ARM64/${SHA256_MACOS_ARM64}/" "$FORMULA"
          sed -i "s/PLACEHOLDER_SHA256_MACOS_X64/${SHA256_MACOS_X64}/" "$FORMULA"
          sed -i "s/PLACEHOLDER_SHA256_LINUX_ARM64/${SHA256_LINUX_ARM64}/" "$FORMULA"
          sed -i "s/PLACEHOLDER_SHA256_LINUX_X64/${SHA256_LINUX_X64}/" "$FORMULA"
          
          echo "Updated Formula for version ${VERSION}"
          cat "$FORMULA"

      - name: Update Homebrew Cask (Desktop)
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA256_MACOS_ARM64: ${{ needs.prepare.outputs.desktop_sha256_macos_arm64 }}
          SHA256_MACOS_X64: ${{ needs.prepare.outputs.desktop_sha256_macos_x64 }}
        run: |
          CASK="packaging/homebrew/Casks/omniedge-desktop.rb"
          
          # Update version
          sed -i "s/version \".*\"/version \"${VERSION}\"/" "$CASK"
          
          # Cask needs separate checksums for arm64 and x64
          # For now, use arm64 as primary (most common for modern Macs)
          sed -i "s/PLACEHOLDER_SHA256/${SHA256_MACOS_ARM64}/" "$CASK"
          
          echo "Updated Cask for version ${VERSION}"
          cat "$CASK"

      - name: Push to Homebrew Tap
        if: ${{ vars.HOMEBREW_TAP_REPO != '' }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          # Clone the tap repository and update
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${{ vars.HOMEBREW_TAP_REPO }}.git" tap
          
          # Copy Formula and Casks
          mkdir -p tap/Formula tap/Casks
          cp packaging/homebrew/Formula/*.rb tap/Formula/
          cp packaging/homebrew/Casks/*.rb tap/Casks/
          
          cd tap
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git diff --cached --quiet || git commit -m "Update to version ${{ needs.prepare.outputs.version }}"
          git push

  # ===========================================================================
  # Publish to AUR (CLI and Desktop)
  # ===========================================================================
  aur:
    name: Update AUR
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: omniedge-cli-bin
            type: cli
          - package: omniedge-desktop-bin
            type: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Update PKGBUILD
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA256_CLI_X64: ${{ needs.prepare.outputs.cli_sha256_linux_x64 }}
          SHA256_CLI_ARM64: ${{ needs.prepare.outputs.cli_sha256_linux_arm64 }}
        run: |
          PKGBUILD="packaging/aur/${{ matrix.package }}/PKGBUILD"
          
          # Update version
          sed -i "s/pkgver=.*/pkgver=${VERSION}/" "$PKGBUILD"
          
          # Update checksums based on package type
          if [ "${{ matrix.type }}" = "cli" ]; then
            sed -i "s/PLACEHOLDER_SHA256_X64/${SHA256_CLI_X64}/" "$PKGBUILD"
            sed -i "s/PLACEHOLDER_SHA256_ARM64/${SHA256_CLI_ARM64}/" "$PKGBUILD"
          fi
          
          echo "Updated PKGBUILD for ${{ matrix.package }}:"
          cat "$PKGBUILD"

      - name: Publish to AUR
        if: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
        uses: KSXGitHub/github-actions-deploy-aur@v2
        with:
          pkgname: ${{ matrix.package }}
          pkgbuild: packaging/aur/${{ matrix.package }}/PKGBUILD
          commit_username: GitHub Actions
          commit_email: actions@github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to version ${{ needs.prepare.outputs.version }}"

  # ===========================================================================
  # Publish to Snap Store
  # ===========================================================================
  snap:
    name: Publish to Snap Store
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4

      - name: Download pre-built binary
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # Download the pre-built Linux x64 binary
          curl -fsSL -o omniedge.tar.gz \
            "https://github.com/${{ github.repository }}/releases/download/v${VERSION}/omniedge-cli-${VERSION}-linux-x64.tar.gz"
          tar -xzf omniedge.tar.gz
          chmod +x omniedge-cli-${VERSION}-linux-x64
          mv omniedge-cli-${VERSION}-linux-x64 packaging/snap/omniedge

      - name: Update snapcraft.yaml version
        run: |
          sed -i "s/version: .*/version: '${{ needs.prepare.outputs.version }}'/" packaging/snap/snapcraft.yaml
          
          # Update to use pre-built binary instead of building from source
          cat > packaging/snap/snapcraft.yaml << 'EOF'
          name: omniedge-cli
          base: core22
          version: '${{ needs.prepare.outputs.version }}'
          summary: Peer-to-peer VPN CLI for edge computing
          description: |
            OmniEdge CLI is a command-line tool for creating secure, peer-to-peer mesh 
            VPN connections. It enables devices to communicate directly across networks 
            with minimal latency and maximum security.
          
          grade: stable
          confinement: classic
          
          architectures:
            - build-on: amd64
          
          parts:
            omniedge:
              plugin: dump
              source: .
              source-type: local
              organize:
                omniedge: bin/omniedge
              stage-packages:
                - ca-certificates
          
          apps:
            omniedge:
              command: bin/omniedge
          EOF

      - name: Build Snap
        uses: snapcore/action-build@v1
        id: build
        with:
          path: packaging/snap

      - name: Publish to Snap Store
        if: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS != '' }}
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable

  # ===========================================================================
  # Publish to Winget
  # ===========================================================================
  winget:
    name: Update Winget
    runs-on: windows-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4

      - name: Update Winget Manifests
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA256_CLI: ${{ needs.prepare.outputs.cli_sha256_windows_x64 }}
          SHA256_DESKTOP: ${{ needs.prepare.outputs.desktop_sha256_windows_msi }}
        run: |
          # Update CLI manifest
          $cliInstaller = Get-Content "packaging/winget/omniedge-cli/OmniEdge.OmniEdgeCLI.installer.yaml" -Raw
          $cliInstaller = $cliInstaller -replace "PackageVersion: .*", "PackageVersion: $env:VERSION"
          $cliInstaller = $cliInstaller -replace "PLACEHOLDER_SHA256", "$env:SHA256_CLI"
          $cliInstaller = $cliInstaller -replace "v\d+\.\d+\.\d+", "v$env:VERSION"
          $cliInstaller = $cliInstaller -replace "(?<!\d)\d+\.\d+\.\d+(?!\d)", "$env:VERSION"
          Set-Content "packaging/winget/omniedge-cli/OmniEdge.OmniEdgeCLI.installer.yaml" $cliInstaller
          
          # Update CLI version manifest
          $cliVersion = Get-Content "packaging/winget/omniedge-cli/OmniEdge.OmniEdgeCLI.yaml" -Raw
          $cliVersion = $cliVersion -replace "PackageVersion: .*", "PackageVersion: $env:VERSION"
          Set-Content "packaging/winget/omniedge-cli/OmniEdge.OmniEdgeCLI.yaml" $cliVersion
          
          # Update Desktop manifest
          $desktopInstaller = Get-Content "packaging/winget/omniedge-desktop/OmniEdge.OmniEdgeDesktop.installer.yaml" -Raw
          $desktopInstaller = $desktopInstaller -replace "PackageVersion: .*", "PackageVersion: $env:VERSION"
          $desktopInstaller = $desktopInstaller -replace "PLACEHOLDER_SHA256_MSI", "$env:SHA256_DESKTOP"
          $desktopInstaller = $desktopInstaller -replace "v\d+\.\d+\.\d+", "v$env:VERSION"
          $desktopInstaller = $desktopInstaller -replace "(?<!\d)\d+\.\d+\.\d+(?!\d)", "$env:VERSION"
          Set-Content "packaging/winget/omniedge-desktop/OmniEdge.OmniEdgeDesktop.installer.yaml" $desktopInstaller
          
          # Update Desktop version manifest
          $desktopVersion = Get-Content "packaging/winget/omniedge-desktop/OmniEdge.OmniEdgeDesktop.yaml" -Raw
          $desktopVersion = $desktopVersion -replace "PackageVersion: .*", "PackageVersion: $env:VERSION"
          Set-Content "packaging/winget/omniedge-desktop/OmniEdge.OmniEdgeDesktop.yaml" $desktopVersion

      - name: Submit CLI to Winget
        if: ${{ secrets.WINGET_TOKEN != '' }}
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: OmniEdge.OmniEdgeCLI
          version: ${{ needs.prepare.outputs.version }}
          installers-regex: '\.zip$'
          token: ${{ secrets.WINGET_TOKEN }}

      - name: Submit Desktop to Winget
        if: ${{ secrets.WINGET_TOKEN != '' }}
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: OmniEdge.OmniEdgeDesktop
          version: ${{ needs.prepare.outputs.version }}
          installers-regex: '\.msi$'
          token: ${{ secrets.WINGET_TOKEN }}

  # ===========================================================================
  # Publish to Chocolatey
  # ===========================================================================
  chocolatey:
    name: Publish to Chocolatey
    runs-on: windows-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: omniedge-cli
            sha_key: cli_sha256_windows_x64
          - package: omniedge-desktop
            sha_key: desktop_sha256_windows_msi
    steps:
      - uses: actions/checkout@v4

      - name: Update Chocolatey Package
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA256: ${{ needs.prepare.outputs[matrix.sha_key] }}
        run: |
          $pkg = "${{ matrix.package }}"
          
          # Update nuspec
          $nuspec = Get-Content "packaging/chocolatey/$pkg/$pkg.nuspec" -Raw
          $nuspec = $nuspec -replace "<version>.*</version>", "<version>$env:VERSION</version>"
          Set-Content "packaging/chocolatey/$pkg/$pkg.nuspec" $nuspec
          
          # Update install script
          $install = Get-Content "packaging/chocolatey/$pkg/tools/chocolateyInstall.ps1" -Raw
          $install = $install -replace "\`$version = '.*'", "`$version = '$env:VERSION'"
          $install = $install -replace "PLACEHOLDER_SHA256", "$env:SHA256"
          Set-Content "packaging/chocolatey/$pkg/tools/chocolateyInstall.ps1" $install

      - name: Build and Push Package
        if: ${{ secrets.CHOCOLATEY_API_KEY != '' }}
        shell: pwsh
        run: |
          cd packaging/chocolatey/${{ matrix.package }}
          choco pack
          choco push ${{ matrix.package }}.${{ needs.prepare.outputs.version }}.nupkg --source https://push.chocolatey.org/ --api-key ${{ secrets.CHOCOLATEY_API_KEY }}

  # ===========================================================================
  # Summary - Show publishing status
  # ===========================================================================
  summary:
    name: Publishing Summary
    runs-on: ubuntu-latest
    needs: [prepare, homebrew, aur, snap, winget, chocolatey]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          
          echo "## Package Publishing Summary for v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package Manager | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Homebrew (Formula + Cask) | ${{ needs.homebrew.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| AUR (CLI + Desktop) | ${{ needs.aur.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Snap Store | ${{ needs.snap.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Winget | ${{ needs.winget.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Chocolatey | ${{ needs.chocolatey.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Required Secrets" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To enable publishing, configure the following secrets:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Secret | Purpose |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`HOMEBREW_TAP_TOKEN\` | Push to Homebrew tap repository |" >> $GITHUB_STEP_SUMMARY
          echo "| \`AUR_SSH_PRIVATE_KEY\` | Push to Arch User Repository |" >> $GITHUB_STEP_SUMMARY
          echo "| \`SNAPCRAFT_STORE_CREDENTIALS\` | Publish to Snap Store |" >> $GITHUB_STEP_SUMMARY
          echo "| \`WINGET_TOKEN\` | Submit to Windows Package Manager |" >> $GITHUB_STEP_SUMMARY
          echo "| \`CHOCOLATEY_API_KEY\` | Publish to Chocolatey.org |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Required Variables" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Variable | Purpose | Example |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|---------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`HOMEBREW_TAP_REPO\` | Homebrew tap repository | \`omniedgeio/homebrew-tap\` |" >> $GITHUB_STEP_SUMMARY
