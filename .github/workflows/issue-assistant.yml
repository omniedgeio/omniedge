name:  Repo Assistant
on:
  issues:
    types: [opened]

jobs:
  respond:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Query Cloudflare Workers AI
        id: ai_query
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 1. Combine README and Issue into a single input string.
          # We use jq's --rawfile to safely read the full README.
          # Then we create a single "input" string for the model.
          
          FULL_INPUT=$(jq -n \
            --rawfile readme README.md \
            --arg issue "$ISSUE_BODY" \
            '"Use the following README as your knowledge base to answer the question at the end.\n\nREADME:\n" + $readme + "\n\nQUESTION FROM USER:\n" + $issue')

          # 2. Build the final JSON payload for the /v1/responses endpoint
          JSON_PAYLOAD=$(jq -n \
            --arg model "@cf/openai/gpt-oss-120b" \
            --arg input "$FULL_INPUT" \
            '{
              model: $model,
              input: $input
            }')

          # 3. Call the v1/responses endpoint
          RESPONSE=$(echo "$JSON_PAYLOAD" | curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/ai/v1/responses" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d @-)

          # 4. Extract the response text
          # Note: The v1/responses endpoint structure usually nests text in .result.response
          RESULT=$(echo "$RESPONSE" | jq -r '.result.response')
          
          if [ "$RESULT" == "null" ] || [ -z "$RESULT" ]; then
            echo "Error: AI response was empty or API error occurred."
            echo "Full API Response: $RESPONSE"
            exit 1
          fi

          {
            echo "ai_text<<EOF"
            echo "$RESULT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post Comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ### 🤖 AI Assistant
            ${{ steps.ai_query.outputs.ai_text }}