name: Full-Context AI Assistant
on:
  issues:
    types: [opened]

jobs:
  respond:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Query Cloudflare Workers AI
        id: ai_query
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 1. Use jq to build the payload. 
          # --rawfile reads the entire README.md directly into a variable.
          # --arg takes the issue body from the environment variable.
          
          JSON_PAYLOAD=$(jq -n \
            --rawfile readme README.md \
            --arg issue "$ISSUE_BODY" \
            '{
              messages: [
                { 
                  role: "system", 
                  content: ("You are a technical support assistant for this repository. Use the following README content to answer the user: \n\n" + $readme) 
                },
                { 
                  role: "user", 
                  content: $issue 
                }
              ]
            }')

          # 2. Call Cloudflare API
          # Using @- tells curl to read the JSON payload from the pipe (stdin)
          RESPONSE=$(echo "$JSON_PAYLOAD" | curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/ai/run/@cf/meta/llama-3-8b-instruct" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d @-)

          # 3. Extract result
          RESULT=$(echo "$RESPONSE" | jq -r '.result.response')
          
          # Check if the result is empty or null (Cloudflare error)
          if [ "$RESULT" == "null" ] || [ -z "$RESULT" ]; then
            echo "Error: Cloudflare AI did not return a response."
            echo "Full API Response: $RESPONSE"
            exit 1
          fi

          # 4. Save result for the next step
          {
            echo "ai_text<<EOF"
            echo "$RESULT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post Comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ### 🤖 AI Assistant
            ${{ steps.ai_query.outputs.ai_text }}