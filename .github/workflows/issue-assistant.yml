name:  Repo Assistant
on:
  issues:
    types: [opened]

jobs:
  respond:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Query Cloudflare Workers AI
        id: ai_query
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 1. Create a temporary prompt file to avoid shell expansion issues
          echo "Use the following README as your knowledge base to answer the question at the end." > prompt_context.txt
          echo -e "\n\n--- README START ---\n" >> prompt_context.txt
          cat README.md >> prompt_context.txt
          echo -e "\n--- README END ---\n" >> prompt_context.txt
          echo -e "\nUSER QUESTION:\n" >> prompt_context.txt
          echo "$ISSUE_BODY" >> prompt_context.txt

          # 2. Use jq to build the final JSON from the file
          # --rawfile reads the text exactly as it is on disk
          jq -n \
            --arg model "@cf/openai/gpt-oss-120b" \
            --rawfile input prompt_context.txt \
            '{model: $model, input: $input}' > payload.json

          # 3. Call Cloudflare API using the file reference
          RESPONSE=$(curl -s -X POST \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/ai/v1/responses" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            -d @payload.json)

          # 4. Extract the response text
          # The v1/responses endpoint returns an 'output' array. 
          # Index 0 is often 'reasoning', and Index 1 is the 'text' answer.
          
          # We use -r for raw output and filter for the text content
          RESULT=$(echo "$RESPONSE" | jq -r '.output[] | select(.type == "message") | .content[0].text')

          # If the above filter fails, try the index-based fallback
          if [ "$RESULT" == "null" ] || [ -z "$RESULT" ]; then
            RESULT=$(echo "$RESPONSE" | jq -r '.output[1].content[0].text')
          fi
          
          # Check for errors in the response
          if [ "$RESULT" == "null" ] || [ -z "$RESULT" ]; then
            echo "Failed to parse AI response. Full JSON:"
            echo "$RESPONSE"
            exit 1
          fi

          {
            echo "ai_text<<EOF"
            echo "$RESULT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post Comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            ### 🤖 AI Assistant
            ${{ steps.ai_query.outputs.ai_text }}