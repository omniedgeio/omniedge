name: "Notify Dependent Repos"

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v2.0.0)'
        required: true
        type: string
      type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - cli
          - desktop
          - all

jobs:
  # ===========================================================================
  # Resolve tag/version for workflow_run or manual dispatch
  # ===========================================================================
  resolve-tag:
    name: Resolve Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      is_tag: ${{ steps.resolve.outputs.is_tag }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'workflow_run'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve release tag
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_TAG="${{ github.event.inputs.tag }}"
            if [ -z "$INPUT_TAG" ]; then
              echo "is_tag=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TAG="${INPUT_TAG}"
            VERSION="${TAG#v}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG=$(git tag --points-at HEAD | grep -E '^v' | sort -V | tail -n 1)
          if [ -z "$TAG" ]; then
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "is_tag=true" >> "$GITHUB_OUTPUT"

  notify-cli:
    name: Notify on CLI release
    runs-on: ubuntu-latest
    needs: resolve-tag
    # Only run if Release succeeded and was triggered by a stable tag, or if manually dispatched
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.type == 'cli' || inputs.type == 'all')) ||
      (github.event.workflow_run.conclusion == 'success' && 
       needs.resolve-tag.outputs.is_tag == 'true' &&
       !contains(needs.resolve-tag.outputs.tag, '-beta') &&
       !contains(needs.resolve-tag.outputs.tag, '-rc'))
    steps:
      - name: Get release version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ needs.resolve-tag.outputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Trigger omniedge-docker
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}
          repository: omniedgeio/omniedge-docker
          event-type: cli-release
          client-payload: '{"version": "${{ steps.version.outputs.version }}", "tag": "${{ steps.version.outputs.tag }}"}'

      - name: Trigger omniedge-openwrt
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}
          repository: omniedgeio/omniedge-openwrt
          event-type: cli-release
          client-payload: '{"version": "${{ steps.version.outputs.version }}", "tag": "${{ steps.version.outputs.tag }}"}'

      - name: Trigger omniedge-synology
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}
          repository: omniedgeio/omniedge-synology
          event-type: cli-release
          client-payload: '{"version": "${{ steps.version.outputs.version }}", "tag": "${{ steps.version.outputs.tag }}"}'

      - name: Trigger github-action
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}
          repository: omniedgeio/github-action
          event-type: cli-release
          client-payload: '{"version": "${{ steps.version.outputs.version }}", "tag": "${{ steps.version.outputs.tag }}"}'

      - name: Summary
        run: |
          echo "## Triggered Dependency Updates (CLI Release)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version: **${{ steps.version.outputs.tag }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Notified repositories:" >> $GITHUB_STEP_SUMMARY
          echo "- omniedge-docker" >> $GITHUB_STEP_SUMMARY
          echo "- omniedge-openwrt" >> $GITHUB_STEP_SUMMARY
          echo "- omniedge-synology" >> $GITHUB_STEP_SUMMARY
          echo "- github-action" >> $GITHUB_STEP_SUMMARY

  notify-web-frontend:
    name: Notify omniedge-web-frontend
    runs-on: ubuntu-latest
    needs: resolve-tag
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.type == 'desktop' || inputs.type == 'all')) ||
      (github.event.workflow_run.conclusion == 'success' && 
       needs.resolve-tag.outputs.is_tag == 'true' &&
       !contains(needs.resolve-tag.outputs.tag, '-beta') &&
       !contains(needs.resolve-tag.outputs.tag, '-rc'))
    steps:
      - name: Get release version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ needs.resolve-tag.outputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Trigger omniedge-web-frontend
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}
          repository: omniedgeio/omniedge-web-frontend
          event-type: release
          client-payload: '{"version": "${{ steps.version.outputs.version }}", "tag": "${{ steps.version.outputs.tag }}"}'

      - name: Summary
        run: |
          echo "## Triggered Dependency Updates" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version: **${{ steps.version.outputs.tag }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Notified: omniedge-web-frontend" >> $GITHUB_STEP_SUMMARY
