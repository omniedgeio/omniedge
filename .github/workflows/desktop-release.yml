name: "Release Desktop"

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-beta'
      - 'v*.*.*-rc'
  workflow_dispatch:

env:
  PACKAGE_NAME: omniedge-desktop

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            target: x86_64-unknown-linux-gnu
            platform: linux
            helper_name: omni-helper-x86_64-unknown-linux-gnu
          - os: macos-latest
            arch: arm64
            target: aarch64-apple-darwin
            platform: macos
            helper_name: omni-helper-aarch64-apple-darwin
          - os: macos-15-intel
            arch: x64
            target: x86_64-apple-darwin
            platform: macos
            helper_name: omni-helper-x86_64-apple-darwin
          - os: windows-latest
            arch: x64
            target: x86_64-pc-windows-msvc
            platform: windows
            helper_name: omni-helper-x86_64-pc-windows-msvc.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        working-directory: ui/desktop
        run: npm install

      - name: Create binaries directory
        shell: bash
        run: mkdir -p ui/desktop/src-tauri/binaries

      - name: Build helper binary
        shell: bash
        run: |
          cargo build --release -p omni-helper --target ${{ matrix.target }}
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            cp target/${{ matrix.target }}/release/omni-helper.exe ui/desktop/src-tauri/binaries/${{ matrix.helper_name }}
          else
            cp target/${{ matrix.target }}/release/omni-helper ui/desktop/src-tauri/binaries/${{ matrix.helper_name }}
          fi
          ls -la ui/desktop/src-tauri/binaries/

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: tauri-apps/tauri-action@v1
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ui/desktop
          includeRelease: false
          args: --target ${{ matrix.target }}
          # Use tauri-action's built-in artifact naming and uploading
          releaseAssetNamePattern: 'omniedge-desktop-[version]-${{ matrix.platform }}-${{ matrix.arch }}[_setup][ext]'
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: 'omniedge-desktop-${{ matrix.platform }}-${{ matrix.arch }}-[bundle]'

      - name: Debug - Show artifact paths
        shell: bash
        run: |
          echo "==> Tauri artifact paths: ${{ steps.tauri.outputs.artifactPaths }}"
          echo "==> App version: ${{ steps.tauri.outputs.appVersion }}"

      - name: Find and collect artifacts
        id: artifacts
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          PLATFORM="${{ matrix.platform }}"
          TARGET="${{ matrix.target }}"
          
          mkdir -p dist
          
          # First try to use tauri's artifactPaths output
          ARTIFACT_PATHS="${{ steps.tauri.outputs.artifactPaths }}"
          echo "==> Raw artifact paths from tauri: $ARTIFACT_PATHS"
          
          # If artifactPaths is not empty, use it
          if [[ -n "$ARTIFACT_PATHS" ]]; then
            # Handle JSON array format
            if [[ "$ARTIFACT_PATHS" == "["* ]]; then
              PATHS=$(echo "$ARTIFACT_PATHS" | tr -d '[]"' | tr ',' '\n')
            else
              PATHS=$(echo "$ARTIFACT_PATHS" | tr ',' '\n')
            fi
            
            for path in $PATHS; do
              path=$(echo "$path" | xargs)  # trim whitespace
              if [[ -z "$path" ]] || [[ ! -f "$path" ]]; then
                continue
              fi
              
              filename=$(basename "$path")
              ext="${filename##*.}"
              
              case "$ext" in
                msi)
                  newname="omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.msi"
                  ;;
                exe)
                  newname="omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}_setup.exe"
                  ;;
                dmg)
                  newname="omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.dmg"
                  ;;
                deb)
                  newname="omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.deb"
                  ;;
                AppImage)
                  newname="omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.AppImage"
                  ;;
                *)
                  newname="$filename"
                  ;;
              esac
              
              echo "==> Copying $path -> dist/$newname"
              cp "$path" "dist/$newname"
            done
          else
            # Fallback: manually search for artifacts in bundle directories
            echo "==> artifactPaths is empty, searching for bundles manually..."
            
            BUNDLE_DIRS=(
              "ui/desktop/src-tauri/target/${TARGET}/release/bundle"
              "ui/desktop/src-tauri/target/release/bundle"
            )
            
            for dir in "${BUNDLE_DIRS[@]}"; do
              if [[ -d "$dir" ]]; then
                echo "==> Found bundle directory: $dir"
                
                # Find and copy artifacts
                find "$dir" -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.deb" -o -name "*.AppImage" \) 2>/dev/null | while read -r path; do
                  filename=$(basename "$path")
                  ext="${filename##*.}"
                  
                  case "$ext" in
                    msi)
                      newname="omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.msi"
                      ;;
                    dmg)
                      newname="omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.dmg"
                      ;;
                    deb)
                      newname="omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.deb"
                      ;;
                    AppImage)
                      newname="omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.AppImage"
                      ;;
                    *)
                      newname="$filename"
                      ;;
                  esac
                  
                  echo "==> Copying $path -> dist/$newname"
                  cp "$path" "dist/$newname"
                done
                
                # Handle NSIS .exe separately (in nsis subdirectory)
                find "$dir" -path "*/nsis/*.exe" -type f 2>/dev/null | while read -r path; do
                  newname="omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}_setup.exe"
                  echo "==> Copying $path -> dist/$newname"
                  cp "$path" "dist/$newname"
                done
                
                break
              fi
            done
          fi
          
          echo "==> Final artifacts:"
          ls -la dist/
          
          # Check if we have any artifacts
          if [ -n "$(ls -A dist/ 2>/dev/null)" ]; then
            echo "has_artifacts=true" >> $GITHUB_OUTPUT
          else
            echo "has_artifacts=false" >> $GITHUB_OUTPUT
            echo "::warning::No artifacts found in dist/"
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        if: steps.artifacts.outputs.has_artifacts == 'true'
        with:
          name: omniedge-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*

      - name: Upload to Release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/') && steps.artifacts.outputs.has_artifacts == 'true'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
          prerelease: ${{ contains(github.ref, '-') }}
          release_name: "omniedge-desktop ${{ github.ref_name }}"
          body: |
            ## omniedge-desktop ${{ github.ref_name }}

            ### Downloads

            | Platform | Architecture | File |
            |----------|--------------|------|
            | Windows | x86_64 | `omniedge-desktop-*-windows-x64.msi` / `-setup.exe` |
            | macOS | x86_64 | `omniedge-desktop-*-macos-x64.dmg` |
            | macOS | ARM64 (Apple Silicon) | `omniedge-desktop-*-macos-arm64.dmg` |
            | Linux | x86_64 | `omniedge-desktop-*-linux-x64.deb` / `.AppImage` |

            ### macOS Installation

            1. Download the `.dmg` file for your Mac (ARM64 for Apple Silicon, x64 for Intel)
            2. Open the DMG and drag **OmniEdge** to **Applications**
            3. Open **OmniEdge** from Applications
            4. If you see a security warning:
               - Open **System Settings** → **Privacy & Security**
               - Scroll down and click **Open Anyway** next to the OmniEdge message
               - Click **Open** in the confirmation dialog
