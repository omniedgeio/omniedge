name: "Release Desktop"

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-beta.*'
      - 'v*.*.*-rc.*'
  workflow_dispatch:

env:
  PACKAGE_NAME: omniedge-desktop

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
            platform: linux
          - os: macos-latest
            arch: aarch64
            target: aarch64-apple-darwin
            platform: macos
          - os: macos-13
            arch: x86_64
            target: x86_64-apple-darwin
            platform: macos
          - os: windows-latest
            arch: x86_64
            platform: windows

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        working-directory: ui/desktop
        run: npm install

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ui/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "OmniEdge Desktop v__VERSION__"
          releaseBody: |
            ## OmniEdge Desktop ${{ github.ref_name }}
            
            ### Downloads
            
            | Platform | Architecture | File |
            |----------|--------------|------|
            | Windows | x86_64 | `omniedge-desktop-*-windows-x64.msi` / `.exe` |
            | macOS | x86_64 | `omniedge-desktop-*-macos-x64.dmg` |
            | macOS | ARM64 (Apple Silicon) | `omniedge-desktop-*-macos-arm64.dmg` |
            | Linux | x86_64 | `omniedge-desktop-*-linux-x64.deb` / `.AppImage` |
            
            See the assets below for your platform.
          releaseDraft: true
          prerelease: ${{ contains(github.ref, '-') }}
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Rename artifacts with omniedge-desktop prefix
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          PLATFORM="${{ matrix.platform }}"
          
          # Create dist directory for renamed files
          mkdir -p renamed-dist
          
          # Find and rename built artifacts
          if [[ "$PLATFORM" == "windows" ]]; then
            # Windows: .msi and .exe
            find ui/desktop/src-tauri/target -name "*.msi" -exec cp {} renamed-dist/omniedge-desktop-${VERSION}-windows-${ARCH}.msi \; 2>/dev/null || true
            find ui/desktop/src-tauri/target -name "*setup*.exe" -exec cp {} renamed-dist/omniedge-desktop-${VERSION}-windows-${ARCH}-setup.exe \; 2>/dev/null || true
          elif [[ "$PLATFORM" == "macos" ]]; then
            # macOS: .dmg
            find ui/desktop/src-tauri/target -name "*.dmg" -exec cp {} renamed-dist/omniedge-desktop-${VERSION}-macos-${ARCH}.dmg \; 2>/dev/null || true
          elif [[ "$PLATFORM" == "linux" ]]; then
            # Linux: .deb and .AppImage
            find ui/desktop/src-tauri/target -name "*.deb" -exec cp {} renamed-dist/omniedge-desktop-${VERSION}-linux-${ARCH}.deb \; 2>/dev/null || true
            find ui/desktop/src-tauri/target -name "*.AppImage" -exec cp {} renamed-dist/omniedge-desktop-${VERSION}-linux-${ARCH}.AppImage \; 2>/dev/null || true
          fi
          
          # List renamed files
          ls -la renamed-dist/ || echo "No files renamed"

      - name: Upload renamed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omniedge-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: renamed-dist/*
          if-no-files-found: ignore

      - name: Upload to Release (renamed)
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: renamed-dist/*
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
          prerelease: ${{ contains(github.ref, '-') }}
