name: "Release Desktop"

on:
  workflow_run:
    workflows: ["Release CLI"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 2.3.0)'
        required: false
        type: string

concurrency:
  group: release-desktop-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

env:
  PACKAGE_NAME: omniedge-desktop
  CARGO_TERM_COLOR: always

jobs:
  publish-tauri:
    permissions:
      contents: write
    # Only run if Release CLI succeeded and was triggered by a tag, or if manually dispatched
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            target: x86_64-unknown-linux-gnu
            platform: linux
            helper_name: omni-helper-x86_64-unknown-linux-gnu
          - os: macos-latest
            arch: arm64
            target: aarch64-apple-darwin
            platform: macos
            helper_name: omni-helper-aarch64-apple-darwin
          - os: macos-15-intel
            arch: x64
            target: x86_64-apple-darwin
            platform: macos
            helper_name: omni-helper-x86_64-apple-darwin
          - os: windows-latest
            arch: x64
            target: x86_64-pc-windows-msvc
            platform: windows
            helper_name: omni-helper-x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ui/desktop/package-lock.json

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ui/desktop/src-tauri -> target
          shared-key: ${{ matrix.target }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        shell: bash
        working-directory: ui/desktop
        run: npm ci

      - name: Create binaries directory
        shell: bash
        run: mkdir -p ui/desktop/src-tauri/binaries

      - name: Build helper binary
        shell: bash
        run: |
          cargo build --release -p omni-helper --target ${{ matrix.target }}
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            cp "target/${{ matrix.target }}/release/omni-helper.exe" "ui/desktop/src-tauri/binaries/${{ matrix.helper_name }}.exe"
          else
            cp "target/${{ matrix.target }}/release/omni-helper" "ui/desktop/src-tauri/binaries/${{ matrix.helper_name }}"
          fi
          ls -la ui/desktop/src-tauri/binaries/

      - name: Get version
        id: version
        shell: bash
        run: |
          # Handle workflow_run trigger (from Release CLI)
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            VERSION="${{ github.event.workflow_run.head_branch }}"
            VERSION="${VERSION#v}"  # Remove 'v' prefix
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"  # Remove 'v' prefix
          else
            # Read version from tauri.conf.json for manual runs using jq
            VERSION=$(jq -r '.version' ui/desktop/src-tauri/tauri.conf.json)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "==> Version: $VERSION"

      - name: Build desktop (Tauri)
        timeout-minutes: 30
        shell: bash
        working-directory: ui/desktop
        run: |
          # Force ad-hoc signing by unsetting certificate environment variables
          # GitHub Actions injects secrets, so we must unset them in the shell
          unset APPLE_CERTIFICATE
          unset APPLE_CERTIFICATE_PASSWORD
          export APPLE_SIGNING_IDENTITY="-"
          
          npm run tauri -- build --target ${{ matrix.target }} --verbose
          
          # Verify that bundles were created
          # Note: Tauri uses the workspace root's target directory, not src-tauri/target
          BUNDLE_DIR="../../target/${{ matrix.target }}/release/bundle"
          echo "==> Checking for bundle directory: $BUNDLE_DIR"
          if [[ -d "$BUNDLE_DIR" ]]; then
            echo "==> Bundle directory contents:"
            ls -laR "$BUNDLE_DIR"
          else
            echo "==> ERROR: Bundle directory not found!"
            echo "==> Listing target directory structure:"
            find ../../target -type d -name bundle 2>/dev/null || echo "No bundle directories found"
            find ../../target -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" \) 2>/dev/null || echo "No bundle files found"
            exit 1
          fi

      - name: Find and rename artifacts
        id: artifacts
        shell: bash
        run: |
          set -x  # Enable debug output
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          PLATFORM="${{ matrix.platform }}"
          TARGET="${{ matrix.target }}"
          # Tauri uses the workspace root's target directory
          BUNDLE_DIR="target/${TARGET}/release/bundle"
          
          echo "==> Looking for artifacts in: $BUNDLE_DIR"
          echo "==> VERSION=$VERSION, PLATFORM=$PLATFORM, ARCH=$ARCH"
          
          # Copy and rename artifacts to root directory
          # Use nullglob to handle no matches gracefully
          shopt -s nullglob
          
          # macOS DMG
          for f in "$BUNDLE_DIR"/dmg/*.dmg "$BUNDLE_DIR"/macos/*.dmg; do
            cp "$f" "omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.dmg"
            echo "==> Created: omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.dmg from $f"
          done
          
          # Windows MSI
          for f in "$BUNDLE_DIR"/msi/*.msi; do
            cp "$f" "omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.msi"
            echo "==> Created: omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.msi from $f"
          done
          
          # Windows NSIS
          for f in "$BUNDLE_DIR"/nsis/*.exe; do
            cp "$f" "omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}-setup.exe"
            echo "==> Created: omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}-setup.exe from $f"
          done
          
          # Linux DEB
          for f in "$BUNDLE_DIR"/deb/*/*.deb "$BUNDLE_DIR"/deb/*.deb; do
            cp "$f" "omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.deb"
            echo "==> Created: omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.deb from $f"
          done
          
          # Linux RPM
          for f in "$BUNDLE_DIR"/rpm/*.rpm; do
            cp "$f" "omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.rpm"
            echo "==> Created: omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.rpm from $f"
          done
          
          # Linux AppImage
          for f in "$BUNDLE_DIR"/appimage/*.AppImage; do
            cp "$f" "omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.AppImage"
            echo "==> Created: omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.AppImage from $f"
          done
          
          shopt -u nullglob
          
          # List final artifacts
          echo "==> Final artifacts in root:"
          ls -la omniedge-desktop-* 2>/dev/null || echo "WARNING: No artifacts created!"
          
          # Set output for conditional steps
          if ls omniedge-desktop-* 1>/dev/null 2>&1; then
            echo "has_artifacts=true" >> $GITHUB_OUTPUT
          else
            echo "has_artifacts=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate checksums
        if: steps.artifacts.outputs.has_artifacts == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          for f in omniedge-desktop-*; do
            if [[ "${{ matrix.platform }}" == "windows" ]]; then
              certutil -hashfile "$f" SHA256 | grep -v "SHA256" | grep -v "CertUtil" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
            echo "==> Generated checksum for $f"
          done
          shopt -u nullglob

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: steps.artifacts.outputs.has_artifacts == 'true'
        with:
          name: omniedge-desktop-${{ steps.version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            omniedge-desktop-*.dmg
            omniedge-desktop-*.msi
            omniedge-desktop-*.exe
            omniedge-desktop-*.deb
            omniedge-desktop-*.rpm
            omniedge-desktop-*.AppImage
            omniedge-desktop-*.sha256
          if-no-files-found: warn

      - name: Upload to Release
        uses: svenstaro/upload-release-action@v2
        if: steps.artifacts.outputs.has_artifacts == 'true'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: omniedge-desktop-${{ steps.version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}*
          file_glob: true
          tag: ${{ steps.version.outputs.tag }}
          overwrite: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          release_name: "omniedge ${{ steps.version.outputs.tag }}"
          body: |
            ## omniedge ${{ steps.version.outputs.tag }}

            ### CLI Downloads

            | Platform | Architecture | Package |
            |----------|--------------|---------|
            | Linux | x86_64, ARM64, RISC-V 64 | `.tar.gz`, `.deb`, `.rpm`, `.AppImage` |
            | macOS | x86_64, ARM64 (Apple Silicon) | `.tar.gz` |
            | Windows | x86_64 | `.zip` |

            ### Desktop Downloads

            | Platform | Architecture | Package |
            |----------|--------------|---------|
            | Windows | x86_64 | `.msi`, `-setup.exe` |
            | macOS | x86_64, ARM64 (Apple Silicon) | `.dmg` |
            | Linux | x86_64 | `.deb`, `.AppImage` |

            ### Installation

            **CLI - Debian/Ubuntu:**
            ```bash
            sudo dpkg -i omniedge-cli-*-linux-amd64.deb
            ```

            **CLI - Fedora/RHEL:**
            ```bash
            sudo rpm -i omniedge-cli-*-linux-x86_64.rpm
            ```

            **Desktop - macOS:**
            1. Download the `.dmg` file for your Mac
            2. Open the DMG and drag **OmniEdge** to **Applications**
            3. If you see a security warning, go to **System Settings** → **Privacy & Security** → **Open Anyway**
