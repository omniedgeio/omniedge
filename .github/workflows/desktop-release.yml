name: "Release Desktop"

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-beta'
      - 'v*.*.*-rc'
  workflow_dispatch:

env:
  PACKAGE_NAME: omniedge-desktop

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            target: x86_64-unknown-linux-gnu
            platform: linux
            helper_name: omni-helper-x86_64-unknown-linux-gnu
          - os: macos-latest
            arch: arm64
            target: aarch64-apple-darwin
            platform: macos
            helper_name: omni-helper-aarch64-apple-darwin
          - os: macos-15-intel
            arch: x64
            target: x86_64-apple-darwin
            platform: macos
            helper_name: omni-helper-x86_64-apple-darwin
          - os: windows-latest
            arch: x64
            target: x86_64-pc-windows-msvc
            platform: windows
            helper_name: omni-helper-x86_64-pc-windows-msvc.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        working-directory: ui/desktop
        run: npm install

      - name: Create binaries directory
        shell: bash
        run: mkdir -p ui/desktop/src-tauri/binaries

      - name: Build helper binary
        shell: bash
        run: |
          cargo build --release -p omni-helper --target ${{ matrix.target }}
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            cp target/${{ matrix.target }}/release/omni-helper.exe ui/desktop/src-tauri/binaries/${{ matrix.helper_name }}
          else
            cp target/${{ matrix.target }}/release/omni-helper ui/desktop/src-tauri/binaries/${{ matrix.helper_name }}
          fi
          ls -la ui/desktop/src-tauri/binaries/

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ui/desktop
          includeRelease: false
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Ad-hoc sign macOS app and rebuild DMG (prevents "app is damaged" error)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          TARGET="${{ matrix.target }}"
          BUNDLE_DIR="target/${TARGET}/release/bundle"
          
          # Find the DMG
          DMG_PATH=$(find "${BUNDLE_DIR}/dmg" -name "*.dmg" -type f 2>/dev/null | head -1)
          if [[ -z "$DMG_PATH" ]]; then
            echo "==> No DMG found, skipping signing"
            exit 0
          fi
          
          echo "==> Found DMG: ${DMG_PATH}"
          DMG_NAME=$(basename "$DMG_PATH")
          
          # Create temp directory for extraction
          TEMP_DIR=$(mktemp -d)
          MOUNT_POINT="${TEMP_DIR}/mount"
          APP_DIR="${TEMP_DIR}/app"
          mkdir -p "$MOUNT_POINT" "$APP_DIR"
          
          # Mount the DMG
          echo "==> Mounting DMG..."
          hdiutil attach "$DMG_PATH" -mountpoint "$MOUNT_POINT" -quiet
          
          # Copy the app out
          APP_NAME=$(ls "$MOUNT_POINT" | grep "\.app$" | head -1)
          if [[ -z "$APP_NAME" ]]; then
            echo "==> No .app found in DMG"
            hdiutil detach "$MOUNT_POINT" -quiet
            exit 0
          fi
          
          echo "==> Extracting: ${APP_NAME}"
          cp -R "${MOUNT_POINT}/${APP_NAME}" "$APP_DIR/"
          
          # Unmount the DMG
          hdiutil detach "$MOUNT_POINT" -quiet
          
          # Ad-hoc sign the app with hardened runtime
          APP_PATH="${APP_DIR}/${APP_NAME}"
          echo "==> Ad-hoc signing: ${APP_PATH}"
          
          # Sign all nested components first (helpers, frameworks, etc.)
          find "$APP_PATH" -type f \( -name "*.dylib" -o -perm +111 \) | while read -r file; do
            if file "$file" | grep -q "Mach-O"; then
              codesign --force --sign - "$file" 2>/dev/null || true
            fi
          done
          
          # Sign the main app bundle
          codesign --force --deep --sign - "$APP_PATH"
          
          # Verify
          echo "==> Verifying signature..."
          codesign --verify --verbose "$APP_PATH" || echo "Warning: Verification showed issues but continuing..."
          
          # Recreate the DMG
          echo "==> Recreating DMG..."
          rm -f "$DMG_PATH"
          hdiutil create -volname "OmniEdge" -srcfolder "$APP_DIR" -ov -format UDZO "$DMG_PATH"
          
          # Cleanup
          rm -rf "$TEMP_DIR"
          
          echo "==> Done! Signed DMG: ${DMG_PATH}"
          ls -la "$DMG_PATH"

      - name: Rename artifacts with omniedge-desktop prefix
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          PLATFORM="${{ matrix.platform }}"
          TARGET="${{ matrix.target }}"
          
          # Create dist directory for renamed files
          mkdir -p renamed-dist
          
          # Debug: Show what was built
          echo "==> Searching for build artifacts..."
          find target -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.dmg" -o -name "*.deb" -o -name "*.AppImage" \) 2>/dev/null || true
          
          # Tauri builds to target/<target>/release/bundle/ when using --target
          BUNDLE_DIR="target/${TARGET}/release/bundle"
          echo "==> Looking in: ${BUNDLE_DIR}"
          ls -la "${BUNDLE_DIR}" 2>/dev/null || echo "Bundle dir not found, checking alternatives..."
          
          # Find and rename built artifacts
          if [[ "$PLATFORM" == "windows" ]]; then
            # Windows: .msi in bundle/msi/, NSIS .exe in bundle/nsis/
            if [[ -d "${BUNDLE_DIR}/msi" ]]; then
              find "${BUNDLE_DIR}/msi" -name "*.msi" -exec cp {} renamed-dist/omniedge-desktop-${VERSION}-windows-${ARCH}.msi \;
            fi
            if [[ -d "${BUNDLE_DIR}/nsis" ]]; then
              find "${BUNDLE_DIR}/nsis" -name "*.exe" -exec cp {} renamed-dist/omniedge-desktop-${VERSION}-windows-${ARCH}-setup.exe \;
            fi
          elif [[ "$PLATFORM" == "macos" ]]; then
            # macOS: .dmg in bundle/dmg/
            if [[ -d "${BUNDLE_DIR}/dmg" ]]; then
              find "${BUNDLE_DIR}/dmg" -name "*.dmg" -exec cp {} renamed-dist/omniedge-desktop-${VERSION}-macos-${ARCH}.dmg \;
            fi
          elif [[ "$PLATFORM" == "linux" ]]; then
            # Linux: .deb in bundle/deb/, .AppImage in bundle/appimage/
            if [[ -d "${BUNDLE_DIR}/deb" ]]; then
              find "${BUNDLE_DIR}/deb" -name "*.deb" -exec cp {} renamed-dist/omniedge-desktop-${VERSION}-linux-${ARCH}.deb \;
            fi
            if [[ -d "${BUNDLE_DIR}/appimage" ]]; then
              find "${BUNDLE_DIR}/appimage" -name "*.AppImage" -exec cp {} renamed-dist/omniedge-desktop-${VERSION}-linux-${ARCH}.AppImage \;
            fi
          fi
          
          # List renamed files
          echo "==> Renamed artifacts:"
          ls -la renamed-dist/ || echo "No files renamed"

      - name: Check for artifacts
        id: check_artifacts
        shell: bash
        run: |
          if [ -n "$(ls -A renamed-dist/ 2>/dev/null)" ]; then
            echo "has_artifacts=true" >> $GITHUB_OUTPUT
          else
            echo "has_artifacts=false" >> $GITHUB_OUTPUT
            echo "::warning::No artifacts found to upload"
          fi

      - name: Upload renamed artifacts
        uses: actions/upload-artifact@v4
        if: steps.check_artifacts.outputs.has_artifacts == 'true'
        with:
          name: omniedge-desktop-${{ steps.version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: renamed-dist/*

      - name: Upload to Release (renamed)
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/') && steps.check_artifacts.outputs.has_artifacts == 'true'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: renamed-dist/*
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
          prerelease: ${{ contains(github.ref, '-') }}
          release_name: "omniedge-desktop ${{ github.ref_name }}"
          body: |
            ## omniedge-desktop ${{ github.ref_name }}

            ### Downloads

            | Platform | Architecture | File |
            |----------|--------------|------|
            | Windows | x86_64 | `omniedge-desktop-*-windows-x64.msi` / `-setup.exe` |
            | macOS | x86_64 | `omniedge-desktop-*-macos-x64.dmg` |
            | macOS | ARM64 (Apple Silicon) | `omniedge-desktop-*-macos-arm64.dmg` |
            | Linux | x86_64 | `omniedge-desktop-*-linux-x64.deb` / `.AppImage` |

            ### macOS Installation

            1. Download the `.dmg` file for your Mac (ARM64 for Apple Silicon, x64 for Intel)
            2. Open the DMG and drag **OmniEdge** to **Applications**
            3. Open **OmniEdge** from Applications
            4. If you see a security warning:
               - Open **System Settings** → **Privacy & Security**
               - Scroll down and click **Open Anyway** next to the OmniEdge message
               - Click **Open** in the confirmation dialog
