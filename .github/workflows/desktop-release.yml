name: "Release Desktop"

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-beta'
      - 'v*.*.*-rc'
  workflow_dispatch:

env:
  PACKAGE_NAME: omniedge-desktop

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            target: x86_64-unknown-linux-gnu
            platform: linux
            helper_name: omni-helper-x86_64-unknown-linux-gnu
          - os: macos-latest
            arch: arm64
            target: aarch64-apple-darwin
            platform: macos
            helper_name: omni-helper-aarch64-apple-darwin
          - os: macos-15-intel
            arch: x64
            target: x86_64-apple-darwin
            platform: macos
            helper_name: omni-helper-x86_64-apple-darwin
          - os: windows-latest
            arch: x64
            target: x86_64-pc-windows-msvc
            platform: windows
            helper_name: omni-helper-x86_64-pc-windows-msvc.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        working-directory: ui/desktop
        run: npm install

      - name: Create binaries directory
        shell: bash
        run: mkdir -p ui/desktop/src-tauri/binaries

      - name: Build helper binary
        shell: bash
        run: |
          cargo build --release -p omni-helper --target ${{ matrix.target }}
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            cp target/${{ matrix.target }}/release/omni-helper.exe ui/desktop/src-tauri/binaries/${{ matrix.helper_name }}
          else
            cp target/${{ matrix.target }}/release/omni-helper ui/desktop/src-tauri/binaries/${{ matrix.helper_name }}
          fi
          ls -la ui/desktop/src-tauri/binaries/

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"  # Remove 'v' prefix
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: ui/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "omniedge-desktop v__VERSION__"
          releaseBody: |
            ## omniedge-desktop ${{ github.ref_name }}
            
            ### Downloads
            
            | Platform | Architecture | File |
            |----------|--------------|------|
            | Windows | x86_64 | `omniedge-desktop-*-windows-x64.msi` / `.exe` |
            | macOS | x86_64 | `omniedge-desktop-*-macos-x64.dmg` |
            | macOS | ARM64 (Apple Silicon) | `omniedge-desktop-*-macos-arm64.dmg` |
            | Linux | x86_64 | `omniedge-desktop-*-linux-x64.deb` / `.AppImage` |
            
            See the assets below for your platform.
          releaseDraft: true
          prerelease: ${{ contains(github.ref, '-') }}
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Rename artifacts with omniedge-desktop prefix
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          PLATFORM="${{ matrix.platform }}"
          
          # Create dist directory for renamed files
          mkdir -p renamed-dist
          
          # Find and rename built artifacts (Tauri builds to workspace target/ directory)
          if [[ "$PLATFORM" == "windows" ]]; then
            # Windows: .msi and .exe
            find target -name "*.msi" -exec cp {} renamed-dist/omniedge-desktop-${VERSION}-windows-${ARCH}.msi \; 2>/dev/null || true
            find target -name "*setup*.exe" -exec cp {} renamed-dist/omniedge-desktop-${VERSION}-windows-${ARCH}-setup.exe \; 2>/dev/null || true
          elif [[ "$PLATFORM" == "macos" ]]; then
            # macOS: .dmg
            find target -name "*.dmg" -exec cp {} renamed-dist/omniedge-desktop-${VERSION}-macos-${ARCH}.dmg \; 2>/dev/null || true
          elif [[ "$PLATFORM" == "linux" ]]; then
            # Linux: .deb and .AppImage
            find target -name "*.deb" -exec cp {} renamed-dist/omniedge-desktop-${VERSION}-linux-${ARCH}.deb \; 2>/dev/null || true
            find target -name "*.AppImage" -exec cp {} renamed-dist/omniedge-desktop-${VERSION}-linux-${ARCH}.AppImage \; 2>/dev/null || true
          fi
          
          # List renamed files
          ls -la renamed-dist/ || echo "No files renamed"

      - name: Upload renamed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omniedge-desktop-${{ steps.version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: renamed-dist/*
          if-no-files-found: ignore

      - name: Upload to Release (renamed)
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: renamed-dist/*
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
          prerelease: ${{ contains(github.ref, '-') }}
