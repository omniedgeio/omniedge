name: "Release Desktop"

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-beta'
      - 'v*.*.*-rc'
  workflow_dispatch:

env:
  PACKAGE_NAME: omniedge-desktop

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            target: x86_64-unknown-linux-gnu
            platform: linux
            helper_name: omni-helper-x86_64-unknown-linux-gnu
          - os: macos-latest
            arch: arm64
            target: aarch64-apple-darwin
            platform: macos
            helper_name: omni-helper-aarch64-apple-darwin
          - os: macos-15-intel
            arch: x64
            target: x86_64-apple-darwin
            platform: macos
            helper_name: omni-helper-x86_64-apple-darwin
          - os: windows-latest
            arch: x64
            target: x86_64-pc-windows-msvc
            platform: windows
            helper_name: omni-helper-x86_64-pc-windows-msvc.exe

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: install frontend dependencies
        working-directory: ui/desktop
        run: npm install

      - name: Create binaries directory
        shell: bash
        run: mkdir -p ui/desktop/src-tauri/binaries

      - name: Build helper binary
        shell: bash
        run: |
          cargo build --release -p omni-helper --target ${{ matrix.target }}
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            cp "target/${{ matrix.target }}/release/omni-helper.exe" "ui/desktop/src-tauri/binaries/${{ matrix.helper_name }}"
          else
            cp "target/${{ matrix.target }}/release/omni-helper" "ui/desktop/src-tauri/binaries/${{ matrix.helper_name }}"
          fi
          ls -la ui/desktop/src-tauri/binaries/

      - name: Get version
        id: version
        shell: bash
        run: |
          # For tag pushes, use the tag name; for workflow_dispatch, read from tauri.conf.json
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"  # Remove 'v' prefix
          else
            # Read version from tauri.conf.json for manual runs
            VERSION=$(grep -o '"version": "[^"]*"' ui/desktop/src-tauri/tauri.conf.json | head -1 | cut -d'"' -f4)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "==> Version: $VERSION"

      - name: Build desktop (Tauri)
        shell: bash
        working-directory: ui/desktop
        run: npm run tauri -- build --target ${{ matrix.target }}

      - name: Find and rename artifacts
        id: artifacts
        shell: bash
        run: |
          set -x  # Enable debug output
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          PLATFORM="${{ matrix.platform }}"
          TARGET="${{ matrix.target }}"
          BUNDLE_DIR="ui/desktop/src-tauri/target/${TARGET}/release/bundle"
          
          if [[ ! -d "$BUNDLE_DIR" ]]; then
            BUNDLE_DIR=$(find ui/desktop/src-tauri/target -type d -name bundle -print -quit 2>/dev/null)
          fi
          
          if [[ -z "$BUNDLE_DIR" ]]; then
            echo "==> No bundle directory found under ui/desktop/src-tauri/target"
            BUNDLE_DIR="ui/desktop/src-tauri/target/${TARGET}/release/bundle"
          fi
          
          echo "==> Looking for artifacts in: $BUNDLE_DIR"
          echo "==> VERSION=$VERSION, PLATFORM=$PLATFORM, ARCH=$ARCH"
          
          # List all bundle contents for debugging
          echo "==> Full target directory structure:"
          find ui/desktop/src-tauri/target -type f \( -name "*.dmg" -o -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" \) 2>/dev/null || echo "No bundle files found anywhere"
          
          # Copy and rename artifacts to root directory
          # Use nullglob to handle no matches gracefully
          shopt -s nullglob
          
          # macOS DMG
          for f in "$BUNDLE_DIR"/dmg/*.dmg "$BUNDLE_DIR"/macos/*.dmg; do
            cp "$f" "omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.dmg"
            echo "==> Created: omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.dmg from $f"
          done
          
          # Windows MSI
          for f in "$BUNDLE_DIR"/msi/*.msi; do
            cp "$f" "omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.msi"
            echo "==> Created: omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.msi from $f"
          done
          
          # Windows NSIS
          for f in "$BUNDLE_DIR"/nsis/*.exe; do
            cp "$f" "omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}-setup.exe"
            echo "==> Created: omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}-setup.exe from $f"
          done
          
          # Linux DEB
          for f in "$BUNDLE_DIR"/deb/*/*.deb "$BUNDLE_DIR"/deb/*.deb; do
            cp "$f" "omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.deb"
            echo "==> Created: omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.deb from $f"
          done
          
          # Linux AppImage
          for f in "$BUNDLE_DIR"/appimage/*.AppImage; do
            cp "$f" "omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.AppImage"
            echo "==> Created: omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.AppImage from $f"
          done
          
          shopt -u nullglob
          
          # List final artifacts
          echo "==> Final artifacts in root:"
          ls -la omniedge-desktop-* 2>/dev/null || echo "WARNING: No artifacts created!"
          
          # Set output for conditional steps
          if ls omniedge-desktop-* 1>/dev/null 2>&1; then
            echo "has_artifacts=true" >> $GITHUB_OUTPUT
          else
            echo "has_artifacts=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: steps.artifacts.outputs.has_artifacts == 'true'
        with:
          name: omniedge-desktop-${{ steps.version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            omniedge-desktop-*.dmg
            omniedge-desktop-*.msi
            omniedge-desktop-*.exe
            omniedge-desktop-*.deb
            omniedge-desktop-*.AppImage
          if-no-files-found: warn

      - name: Upload to Release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/') && steps.artifacts.outputs.has_artifacts == 'true'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: omniedge-desktop-${{ steps.version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}*
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
          prerelease: ${{ contains(github.ref, '-') }}
          release_name: "omniedge-desktop ${{ github.ref_name }}"
          body: |
            ## omniedge-desktop ${{ github.ref_name }}

            ### Downloads

            | Platform | Architecture | File |
            |----------|--------------|------|
            | Windows | x86_64 | `omniedge-desktop-*-windows-x64.msi` / `-setup.exe` |
            | macOS | x86_64 | `omniedge-desktop-*-macos-x64.dmg` |
            | macOS | ARM64 (Apple Silicon) | `omniedge-desktop-*-macos-arm64.dmg` |
            | Linux | x86_64 | `omniedge-desktop-*-linux-x64.deb` / `.AppImage` |

            ### macOS Installation

            1. Download the `.dmg` file for your Mac (ARM64 for Apple Silicon, x64 for Intel)
            2. Open the DMG and drag **OmniEdge** to **Applications**
            3. Open **OmniEdge** from Applications
            4. If you see a security warning:
               - Open **System Settings** → **Privacy & Security**
               - Scroll down and click **Open Anyway** next to the OmniEdge message
               - Click **Open** in the confirmation dialog
