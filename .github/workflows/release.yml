name: "Release"

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-beta.*'
      - 'v*.*.*-rc.*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================================================
  # Build CLI binaries for all platforms
  # ===========================================================================
  build-cli:
    name: Build CLI - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux
            arch: x64
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux
            arch: arm64
            cross: true
          - target: riscv64gc-unknown-linux-musl
            os: ubuntu-latest
            platform: linux
            arch: riscv64
            cross: true
          - target: x86_64-apple-darwin
            os: macos-13
            platform: macos
            arch: x64
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: macos
            arch: arm64
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows
            arch: x64
            cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross.git

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release -p omniedge-cli --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release -p omniedge-cli --target ${{ matrix.target }}

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACT_NAME="omniedge-cli-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p dist
          cp target/${{ matrix.target }}/release/omniedge dist/${ARTIFACT_NAME}
          chmod +x dist/${ARTIFACT_NAME}
          cd dist && tar -czvf ../${ARTIFACT_NAME}.tar.gz ./*

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"
          $ARTIFACT_NAME = "omniedge-cli-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/omniedge.exe" "dist/${ARTIFACT_NAME}.exe"
          Compress-Archive -Path "dist/*" -DestinationPath "${ARTIFACT_NAME}.zip"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniedge-cli-${{ steps.version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            omniedge-cli-*.zip
            omniedge-cli-*.tar.gz
          if-no-files-found: ignore

      - name: Upload to Release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: omniedge-cli-${{ steps.version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}.*
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
          prerelease: ${{ contains(github.ref, '-') }}

  # ===========================================================================
  # Build Desktop (Tauri) for all platforms
  # ===========================================================================
  build-desktop:
    name: Build Desktop - ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            target: x86_64-unknown-linux-gnu
            platform: linux
            helper_name: omni-helper-x86_64-unknown-linux-gnu
          - os: macos-latest
            arch: arm64
            target: aarch64-apple-darwin
            platform: macos
            helper_name: omni-helper-aarch64-apple-darwin
          - os: macos-13
            arch: x64
            target: x86_64-apple-darwin
            platform: macos
            helper_name: omni-helper-x86_64-apple-darwin
          - os: windows-latest
            arch: x64
            target: x86_64-pc-windows-msvc
            platform: windows
            helper_name: omni-helper-x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ui/desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ui/desktop/src-tauri -> target
          shared-key: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: ui/desktop
        run: npm ci

      - name: Build helper binary
        shell: bash
        run: |
          mkdir -p ui/desktop/src-tauri/binaries
          cargo build --release -p omni-helper --target ${{ matrix.target }}
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            cp "target/${{ matrix.target }}/release/omni-helper.exe" "ui/desktop/src-tauri/binaries/${{ matrix.helper_name }}.exe"
          else
            cp "target/${{ matrix.target }}/release/omni-helper" "ui/desktop/src-tauri/binaries/${{ matrix.helper_name }}"
          fi

      - name: Get version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION=$(jq -r '.version' ui/desktop/src-tauri/tauri.conf.json)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Tauri
        timeout-minutes: 30
        shell: bash
        working-directory: ui/desktop
        run: |
          unset APPLE_CERTIFICATE
          unset APPLE_CERTIFICATE_PASSWORD
          export APPLE_SIGNING_IDENTITY="-"
          npm run tauri -- build --target ${{ matrix.target }} --verbose

      - name: Find and rename artifacts
        id: artifacts
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          PLATFORM="${{ matrix.platform }}"
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"
          
          shopt -s nullglob
          
          for f in "$BUNDLE_DIR"/dmg/*.dmg "$BUNDLE_DIR"/macos/*.dmg; do
            cp "$f" "omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.dmg"
          done
          
          for f in "$BUNDLE_DIR"/msi/*.msi; do
            cp "$f" "omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.msi"
          done
          
          for f in "$BUNDLE_DIR"/nsis/*.exe; do
            cp "$f" "omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}-setup.exe"
          done
          
          for f in "$BUNDLE_DIR"/deb/*/*.deb "$BUNDLE_DIR"/deb/*.deb; do
            cp "$f" "omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.deb"
          done
          
          for f in "$BUNDLE_DIR"/rpm/*.rpm; do
            cp "$f" "omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.rpm"
          done
          
          for f in "$BUNDLE_DIR"/appimage/*.AppImage; do
            cp "$f" "omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.AppImage"
          done
          
          shopt -u nullglob
          
          if ls omniedge-desktop-* 1>/dev/null 2>&1; then
            echo "has_artifacts=true" >> $GITHUB_OUTPUT
          else
            echo "has_artifacts=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: steps.artifacts.outputs.has_artifacts == 'true'
        with:
          name: omniedge-desktop-${{ steps.version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: omniedge-desktop-*
          if-no-files-found: warn

      - name: Upload to Release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/') && steps.artifacts.outputs.has_artifacts == 'true'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: omniedge-desktop-${{ steps.version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}*
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
          prerelease: ${{ contains(github.ref, '-') }}

  # ===========================================================================
  # Build DEB packages
  # ===========================================================================
  build-deb:
    name: Build DEB - ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: build-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            src_arch: x64
          - arch: arm64
            src_arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: omniedge-cli-${{ steps.version.outputs.version }}-linux-${{ matrix.src_arch }}

      - name: Extract and build DEB
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          tar -xzvf omniedge-cli-${VERSION}-linux-${{ matrix.src_arch }}.tar.gz
          chmod +x omniedge-cli-${VERSION}-linux-${{ matrix.src_arch }}
          
          PKG_DIR="omniedge-cli_${VERSION}_${{ matrix.arch }}"
          mkdir -p "${PKG_DIR}/DEBIAN" "${PKG_DIR}/usr/bin" "${PKG_DIR}/usr/lib/systemd/system"
          
          cp "omniedge-cli-${VERSION}-linux-${{ matrix.src_arch }}" "${PKG_DIR}/usr/bin/omniedge"
          chmod 755 "${PKG_DIR}/usr/bin/omniedge"
          
          cat > "${PKG_DIR}/DEBIAN/control" << EOF
          Package: omniedge-cli
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: ${{ matrix.arch }}
          Maintainer: OmniEdge Team <support@omniedge.io>
          Description: OmniEdge CLI - Peer-to-peer VPN for edge computing
          Homepage: https://omniedge.io
          EOF
          
          cat > "${PKG_DIR}/usr/lib/systemd/system/omniedge.service" << EOF
          [Unit]
          Description=OmniEdge VPN Service
          After=network-online.target
          Wants=network-online.target
          
          [Service]
          Type=simple
          ExecStart=/usr/bin/omniedge start
          Restart=on-failure
          RestartSec=5
          
          [Install]
          WantedBy=multi-user.target
          EOF
          
          dpkg-deb --build "${PKG_DIR}"
          mv "${PKG_DIR}.deb" "omniedge-cli-${VERSION}-linux-${{ matrix.arch }}.deb"

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: omniedge-cli-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}-deb
          path: "*.deb"

      - name: Upload to Release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "*.deb"
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
          prerelease: ${{ contains(github.ref, '-') }}

  # ===========================================================================
  # Build RPM packages
  # ===========================================================================
  build-rpm:
    name: Build RPM - ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: build-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            src_arch: x64
          - arch: aarch64
            src_arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "rpm_version=${VERSION//-/_}" >> $GITHUB_OUTPUT

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: omniedge-cli-${{ steps.version.outputs.version }}-linux-${{ matrix.src_arch }}

      - name: Install RPM tools
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build RPM
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RPM_VERSION="${{ steps.version.outputs.rpm_version }}"
          
          tar -xzvf omniedge-cli-${VERSION}-linux-${{ matrix.src_arch }}.tar.gz
          chmod +x omniedge-cli-${VERSION}-linux-${{ matrix.src_arch }}
          
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp "omniedge-cli-${VERSION}-linux-${{ matrix.src_arch }}" ~/rpmbuild/SOURCES/omniedge
          
          cat > ~/rpmbuild/SOURCES/omniedge.service << EOF
          [Unit]
          Description=OmniEdge VPN Service
          After=network-online.target
          [Service]
          Type=simple
          ExecStart=/usr/bin/omniedge start
          Restart=on-failure
          [Install]
          WantedBy=multi-user.target
          EOF
          
          cat > ~/rpmbuild/SPECS/omniedge-cli.spec << EOF
          %define __strip /bin/true
          %define debug_package %{nil}
          Name: omniedge-cli
          Version: ${RPM_VERSION}
          Release: 1
          Summary: OmniEdge CLI - Peer-to-peer VPN
          License: Apache-2.0 OR MIT
          URL: https://omniedge.io
          %description
          Peer-to-peer mesh VPN for edge computing.
          %install
          mkdir -p %{buildroot}/usr/bin %{buildroot}/usr/lib/systemd/system
          install -m 755 %{_sourcedir}/omniedge %{buildroot}/usr/bin/omniedge
          install -m 644 %{_sourcedir}/omniedge.service %{buildroot}/usr/lib/systemd/system/
          %files
          /usr/bin/omniedge
          /usr/lib/systemd/system/omniedge.service
          EOF
          
          rpmbuild -bb ~/rpmbuild/SPECS/omniedge-cli.spec --target ${{ matrix.arch }} --define "_rpmdir $(pwd)"
          find . -name "*.rpm" -exec mv {} "omniedge-cli-${VERSION}-linux-${{ matrix.arch }}.rpm" \;

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: omniedge-cli-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}-rpm
          path: "*.rpm"

      - name: Upload to Release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "*.rpm"
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
          prerelease: ${{ contains(github.ref, '-') }}

  # ===========================================================================
  # Build AppImage
  # ===========================================================================
  build-appimage:
    name: Build AppImage
    runs-on: ubuntu-latest
    needs: build-cli

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: omniedge-cli-${{ steps.version.outputs.version }}-linux-x64

      - name: Build AppImage
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          tar -xzvf omniedge-cli-${VERSION}-linux-x64.tar.gz
          chmod +x omniedge-cli-${VERSION}-linux-x64
          
          sudo apt-get update && sudo apt-get install -y libfuse2
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool
          
          APPDIR="OmniEdge-CLI.AppDir"
          mkdir -p "${APPDIR}/usr/bin"
          cp "omniedge-cli-${VERSION}-linux-x64" "${APPDIR}/usr/bin/omniedge"
          chmod 755 "${APPDIR}/usr/bin/omniedge"
          
          cat > "${APPDIR}/omniedge.desktop" << EOF
          [Desktop Entry]
          Type=Application
          Name=OmniEdge CLI
          Exec=omniedge
          Icon=omniedge
          Terminal=true
          Categories=Network;
          EOF
          
          cat > "${APPDIR}/omniedge.svg" << 'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" fill="#4A90D9"/>
            <text x="50" y="60" font-family="Arial" font-size="30" fill="white" text-anchor="middle">OE</text>
          </svg>
          EOF
          
          cat > "${APPDIR}/AppRun" << 'EOF'
          #!/bin/bash
          exec "${0%/*}/usr/bin/omniedge" "$@"
          EOF
          chmod 755 "${APPDIR}/AppRun"
          
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "${APPDIR}" "omniedge-cli-${VERSION}-linux-x86_64.AppImage"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: omniedge-cli-${{ steps.version.outputs.version }}-linux-x86_64-appimage
          path: "*.AppImage"

      - name: Upload to Release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "*.AppImage"
          file_glob: true
          tag: ${{ github.ref }}
          overwrite: true
          prerelease: ${{ contains(github.ref, '-') }}

  # ===========================================================================
  # Release Summary - Final job that downstream workflows wait for
  # ===========================================================================
  release-summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [build-cli, build-desktop, build-deb, build-rpm, build-appimage]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Generate summary
        run: |
          echo "## Release ${{ github.ref_name }} Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### CLI Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Linux: x64, arm64, riscv64 (.tar.gz, .deb, .rpm, .AppImage)" >> $GITHUB_STEP_SUMMARY
          echo "- macOS: x64, arm64 (.tar.gz)" >> $GITHUB_STEP_SUMMARY
          echo "- Windows: x64 (.zip)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Desktop Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Linux: x64 (.deb, .AppImage)" >> $GITHUB_STEP_SUMMARY
          echo "- macOS: x64, arm64 (.dmg)" >> $GITHUB_STEP_SUMMARY
          echo "- Windows: x64 (.msi, .exe)" >> $GITHUB_STEP_SUMMARY
