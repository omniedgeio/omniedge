name: "Release"

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-beta.*'
      - 'v*.*.*-rc.*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ===========================================================================
  # Prepare Release - Extract release notes and create GitHub release
  # ===========================================================================
  prepare-release:
    name: Prepare Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION (tag: $TAG)"

      - name: Extract release notes
        id: release_notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          
          # Extract the section for this version from RELEASE_NOTES.md
          # Match from "## vX.Y.Z" until the next "## v" or end of file
          if [ -f "RELEASE_NOTES.md" ]; then
            # Use awk to extract the section for this version
            NOTES=$(awk -v ver="$TAG" '
              BEGIN { found=0; printing=0 }
              /^## v[0-9]+\.[0-9]+\.[0-9]+/ {
                if (printing) exit
                if ($2 == ver || index($0, ver) > 0) { found=1; printing=1; next }
              }
              printing { print }
            ' RELEASE_NOTES.md)
            
            if [ -z "$NOTES" ]; then
              echo "No release notes found for $TAG, using default"
              NOTES="Release $TAG"
            fi
          else
            NOTES="Release $TAG"
          fi
          
          # Write to file for the release action
          echo "$NOTES" > release_notes.md
          echo "Release notes extracted:"
          head -20 release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "OmniEdge ${{ steps.version.outputs.tag }}"
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # Build CLI binaries for all platforms (with integrated packaging for Linux)
  # ===========================================================================
  build-cli:
    name: Build CLI - ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    needs: prepare-release
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux
            arch: x64
            cross: true
            build_deb: true
            build_rpm: true
            build_appimage: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux
            arch: arm64
            cross: true
            build_deb: true
            build_rpm: true
            build_appimage: false
          - target: riscv64gc-unknown-linux-musl
            os: ubuntu-latest
            platform: linux
            arch: riscv64
            cross: true
            build_deb: false
            build_rpm: false
            build_appimage: false
          - target: x86_64-apple-darwin
            os: macos-15-intel
            platform: macos
            arch: x64
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: macos
            arch: arm64
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: windows
            arch: x64
            cross: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cli-${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build (native)
        if: "!matrix.cross"
        run: cargo build --release -p omniedge-cli --target ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release -p omniedge-cli --target ${{ matrix.target }}

      - name: Get version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION=$(grep -m1 '^version' crates/omniedge-cli/Cargo.toml | cut -d'"' -f2)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "rpm_version=${VERSION//-/_}" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACT_NAME="omniedge-cli-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p dist
          cp target/${{ matrix.target }}/release/omniedge dist/${ARTIFACT_NAME}
          chmod +x dist/${ARTIFACT_NAME}
          cd dist && tar -czvf ../${ARTIFACT_NAME}.tar.gz ./*

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $VERSION = "${{ steps.version.outputs.version }}"
          $ARTIFACT_NAME = "omniedge-cli-${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/omniedge.exe" "dist/${ARTIFACT_NAME}.exe"
          Compress-Archive -Path "dist/*" -DestinationPath "${ARTIFACT_NAME}.zip"

      # ==== Linux-only: Build DEB package ====
      - name: Build DEB package
        if: matrix.build_deb == true
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BINARY="dist/omniedge-cli-${VERSION}-linux-${{ matrix.arch }}"
          
          # Map arch to DEB arch
          case "${{ matrix.arch }}" in
            x64) DEB_ARCH="amd64" ;;
            arm64) DEB_ARCH="arm64" ;;
            *) DEB_ARCH="${{ matrix.arch }}" ;;
          esac
          
          PKG_DIR="omniedge-cli_${VERSION}_${DEB_ARCH}"
          mkdir -p "${PKG_DIR}/DEBIAN" "${PKG_DIR}/usr/bin" "${PKG_DIR}/usr/lib/systemd/system"
          
          cp "${BINARY}" "${PKG_DIR}/usr/bin/omniedge"
          chmod 755 "${PKG_DIR}/usr/bin/omniedge"
          
          cat > "${PKG_DIR}/DEBIAN/control" << EOF
          Package: omniedge-cli
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: ${DEB_ARCH}
          Maintainer: OmniEdge Team <support@omniedge.io>
          Description: OmniEdge CLI - Peer-to-peer VPN for edge computing
          Homepage: https://omniedge.io
          EOF
          
          cat > "${PKG_DIR}/usr/lib/systemd/system/omniedge.service" << EOF
          [Unit]
          Description=OmniEdge VPN Service
          After=network-online.target
          Wants=network-online.target
          
          [Service]
          Type=simple
          ExecStart=/usr/bin/omniedge start
          Restart=on-failure
          RestartSec=5
          
          [Install]
          WantedBy=multi-user.target
          EOF
          
          dpkg-deb --build "${PKG_DIR}"
          # Use consistent naming: omniedge-cli-{version}-linux-{arch}.deb
          mv "${PKG_DIR}.deb" "omniedge-cli-${VERSION}-linux-${{ matrix.arch }}.deb"

      # ==== Linux-only: Build RPM package ====
      - name: Install RPM tools
        if: matrix.build_rpm == true
        run: sudo apt-get update && sudo apt-get install -y rpm

      - name: Build RPM package
        if: matrix.build_rpm == true
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RPM_VERSION="${{ steps.version.outputs.rpm_version }}"
          BINARY="dist/omniedge-cli-${VERSION}-linux-${{ matrix.arch }}"
          
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp "${BINARY}" ~/rpmbuild/SOURCES/omniedge
          
          cat > ~/rpmbuild/SOURCES/omniedge.service << EOF
          [Unit]
          Description=OmniEdge VPN Service
          After=network-online.target
          [Service]
          Type=simple
          ExecStart=/usr/bin/omniedge start
          Restart=on-failure
          [Install]
          WantedBy=multi-user.target
          EOF
          
          # Map arch to RPM arch for build
          case "${{ matrix.arch }}" in
            x64) RPM_ARCH="x86_64" ;;
            arm64) RPM_ARCH="aarch64" ;;
            *) RPM_ARCH="${{ matrix.arch }}" ;;
          esac
          
          cat > ~/rpmbuild/SPECS/omniedge-cli.spec << EOF
          %define __strip /bin/true
          %define debug_package %{nil}
          Name: omniedge-cli
          Version: ${RPM_VERSION}
          Release: 1
          Summary: OmniEdge CLI - Peer-to-peer VPN
          License: Apache-2.0 OR MIT
          URL: https://omniedge.io
          %description
          Peer-to-peer mesh VPN for edge computing.
          %install
          mkdir -p %{buildroot}/usr/bin %{buildroot}/usr/lib/systemd/system
          install -m 755 %{_sourcedir}/omniedge %{buildroot}/usr/bin/omniedge
          install -m 644 %{_sourcedir}/omniedge.service %{buildroot}/usr/lib/systemd/system/
          %files
          /usr/bin/omniedge
          /usr/lib/systemd/system/omniedge.service
          EOF
          
          rpmbuild -bb ~/rpmbuild/SPECS/omniedge-cli.spec --target ${RPM_ARCH} --define "_rpmdir $(pwd)"
          # Use consistent naming: omniedge-cli-{version}-linux-{arch}.rpm
          find . -name "*.rpm" -exec mv {} "omniedge-cli-${VERSION}-linux-${{ matrix.arch }}.rpm" \;

      # ==== Linux x64-only: Build AppImage ====
      - name: Build AppImage
        if: matrix.build_appimage == true
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BINARY="dist/omniedge-cli-${VERSION}-linux-${{ matrix.arch }}"
          
          sudo apt-get update && sudo apt-get install -y libfuse2
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool
          
          APPDIR="OmniEdge-CLI.AppDir"
          mkdir -p "${APPDIR}/usr/bin"
          cp "${BINARY}" "${APPDIR}/usr/bin/omniedge"
          chmod 755 "${APPDIR}/usr/bin/omniedge"
          
          cat > "${APPDIR}/omniedge.desktop" << EOF
          [Desktop Entry]
          Type=Application
          Name=OmniEdge CLI
          Exec=omniedge
          Icon=omniedge
          Terminal=true
          Categories=Network;
          EOF
          
          cat > "${APPDIR}/omniedge.svg" << 'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" fill="#4A90D9"/>
            <text x="50" y="60" font-family="Arial" font-size="30" fill="white" text-anchor="middle">OE</text>
          </svg>
          EOF
          
          cat > "${APPDIR}/AppRun" << 'EOF'
          #!/bin/bash
          exec "${0%/*}/usr/bin/omniedge" "$@"
          EOF
          chmod 755 "${APPDIR}/AppRun"
          
          # Use consistent naming: omniedge-cli-{version}-linux-{arch}.AppImage
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "${APPDIR}" "omniedge-cli-${VERSION}-linux-${{ matrix.arch }}.AppImage"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniedge-cli-${{ steps.version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            omniedge-cli-*.zip
            omniedge-cli-*.tar.gz
            omniedge-cli-*.deb
            omniedge-cli-*.rpm
            omniedge-cli-*.AppImage
          if-no-files-found: ignore

      - name: Upload to Release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          file: omniedge-cli-*
          tag: ${{ github.ref }}
          overwrite: true

  # ===========================================================================
  # Build Desktop (Tauri) for all platforms
  # ===========================================================================
  build-desktop:
    name: Build Desktop - ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    needs: prepare-release
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            target: x86_64-unknown-linux-gnu
            platform: linux
            helper_name: omni-helper-x86_64-unknown-linux-gnu
          - os: macos-latest
            arch: arm64
            target: aarch64-apple-darwin
            platform: macos
            helper_name: omni-helper-aarch64-apple-darwin
          - os: macos-15-intel
            arch: x64
            target: x86_64-apple-darwin
            platform: macos
            helper_name: omni-helper-x86_64-apple-darwin
          - os: windows-latest
            arch: x64
            target: x86_64-pc-windows-msvc
            platform: windows
            helper_name: omni-helper-x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ui/desktop/node_modules
          key: npm-desktop-${{ hashFiles('ui/desktop/package-lock.json') }}
          restore-keys: |
            npm-desktop-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            ui/desktop/src-tauri -> target
          shared-key: desktop-${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Disable Spotlight (macOS)
        if: matrix.platform == 'macos'
        run: |
          sudo mdutil -a -i off
          sudo launchctl unload -w /System/Library/LaunchDaemons/com.apple.metadata.mds.plist 2>/dev/null || true

      - name: Install frontend dependencies
        working-directory: ui/desktop
        run: npm ci

      - name: Build helper binary
        shell: bash
        run: |
          mkdir -p ui/desktop/src-tauri/binaries
          cargo build --release -p omni-helper --target ${{ matrix.target }}
          if [[ "${{ matrix.platform }}" == "windows" ]]; then
            cp "target/${{ matrix.target }}/release/omni-helper.exe" "ui/desktop/src-tauri/binaries/${{ matrix.helper_name }}.exe"
          else
            cp "target/${{ matrix.target }}/release/omni-helper" "ui/desktop/src-tauri/binaries/${{ matrix.helper_name }}"
          fi

      - name: Get version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION=$(jq -r '.version' ui/desktop/src-tauri/tauri.conf.json)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Tauri
        timeout-minutes: 30
        shell: bash
        working-directory: ui/desktop
        run: |
          unset APPLE_CERTIFICATE
          unset APPLE_CERTIFICATE_PASSWORD
          export APPLE_SIGNING_IDENTITY="-"
          
          MAX_ATTEMPTS=3
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "==> Build attempt $ATTEMPT of $MAX_ATTEMPTS"
            if npm run tauri -- build --target ${{ matrix.target }} --verbose; then
              echo "==> Build succeeded"
              break
            fi
            
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "==> Build failed, cleaning up and retrying..."
              if [[ "${{ matrix.platform }}" == "macos" ]]; then
                hdiutil info | grep -E '^/dev/' | awk '{print $1}' | while read dev; do
                  hdiutil detach "$dev" -force 2>/dev/null || true
                done
                sleep 5
              fi
              rm -rf ../../target/${{ matrix.target }}/release/bundle/dmg 2>/dev/null || true
            else
              echo "==> Build failed after $MAX_ATTEMPTS attempts"
              exit 1
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done

      - name: Find and rename artifacts
        id: artifacts
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          PLATFORM="${{ matrix.platform }}"
          BUNDLE_DIR="target/${{ matrix.target }}/release/bundle"
          
          shopt -s nullglob
          
          for f in "$BUNDLE_DIR"/dmg/*.dmg "$BUNDLE_DIR"/macos/*.dmg; do
            cp "$f" "omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.dmg"
          done
          
          for f in "$BUNDLE_DIR"/msi/*.msi; do
            cp "$f" "omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.msi"
          done
          
          for f in "$BUNDLE_DIR"/nsis/*.exe; do
            cp "$f" "omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}-setup.exe"
          done
          
          for f in "$BUNDLE_DIR"/deb/*/*.deb "$BUNDLE_DIR"/deb/*.deb; do
            cp "$f" "omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.deb"
          done
          
          for f in "$BUNDLE_DIR"/rpm/*.rpm; do
            cp "$f" "omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.rpm"
          done
          
          for f in "$BUNDLE_DIR"/appimage/*.AppImage; do
            cp "$f" "omniedge-desktop-${VERSION}-${PLATFORM}-${ARCH}.AppImage"
          done
          
          shopt -u nullglob
          
          if ls omniedge-desktop-* 1>/dev/null 2>&1; then
            echo "has_artifacts=true" >> $GITHUB_OUTPUT
          else
            echo "has_artifacts=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: steps.artifacts.outputs.has_artifacts == 'true'
        with:
          name: omniedge-desktop-${{ steps.version.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: omniedge-desktop-*
          if-no-files-found: warn

      - name: Upload to Release
        uses: svenstaro/upload-release-action@v2
        if: startsWith(github.ref, 'refs/tags/') && steps.artifacts.outputs.has_artifacts == 'true'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          file: omniedge-desktop-*
          tag: ${{ github.ref }}
          overwrite: true

  # ===========================================================================
  # Build OpenWrt packages (IPK and APK) - reuses CLI binaries
  # ===========================================================================
  build-openwrt:
    name: Build OpenWrt - ${{ matrix.openwrt_arch }} (${{ matrix.pkg_format }})
    runs-on: ubuntu-latest
    needs: [prepare-release, build-cli]
    if: startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          # IPK packages for OpenWrt 24.10.x
          - cli_arch: x64
            openwrt_arch: x86_64
            pkg_format: ipk
          - cli_arch: arm64
            openwrt_arch: aarch64_generic
            pkg_format: ipk
          # APK packages for OpenWrt 25.x/snapshot
          - cli_arch: x64
            openwrt_arch: x86_64
            pkg_format: apk
          - cli_arch: arm64
            openwrt_arch: aarch64_generic
            pkg_format: apk

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Building OpenWrt package version: $VERSION"

      - name: Download CLI artifact
        uses: actions/download-artifact@v4
        with:
          name: omniedge-cli-${{ needs.prepare-release.outputs.version }}-linux-${{ matrix.cli_arch }}
          path: artifacts

      - name: Extract and prepare binary
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARCH="${{ matrix.cli_arch }}"
          
          ls -la artifacts/
          
          # Extract the CLI binary from tar.gz
          TAR_FILE="artifacts/omniedge-cli-${VERSION}-linux-${ARCH}.tar.gz"
          mkdir -p extracted
          tar -xzf "$TAR_FILE" -C extracted
          
          # Find and copy the binary
          BINARY=$(find extracted -name "omniedge-cli-*" -type f | head -1)
          if [ -z "$BINARY" ]; then
            BINARY=$(find extracted -name "omniedge" -type f | head -1)
          fi
          
          if [ -z "$BINARY" ]; then
            echo "Error: Could not find binary in archive"
            ls -laR extracted/
            exit 1
          fi
          
          cp "$BINARY" omniedge-binary
          chmod 755 omniedge-binary
          
          # Strip binary if not already stripped (reduces size)
          if [ "$ARCH" = "x64" ]; then
            strip omniedge-binary 2>/dev/null || true
          elif [ "$ARCH" = "arm64" ]; then
            sudo apt-get update && sudo apt-get install -y binutils-aarch64-linux-gnu
            aarch64-linux-gnu-strip omniedge-binary 2>/dev/null || true
          fi
          
          file omniedge-binary
          ls -lh omniedge-binary

      - name: Create IPK package
        if: matrix.pkg_format == 'ipk'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG_ARCH="${{ matrix.openwrt_arch }}"
          
          # Create package directory structure
          PKG_DIR="omniedge_${VERSION}_${PKG_ARCH}"
          mkdir -p "${PKG_DIR}/data/usr/bin"
          mkdir -p "${PKG_DIR}/data/etc/init.d"
          mkdir -p "${PKG_DIR}/data/etc/config"
          mkdir -p "${PKG_DIR}/control"
          
          # Copy binary
          cp omniedge-binary "${PKG_DIR}/data/usr/bin/omniedge"
          chmod 755 "${PKG_DIR}/data/usr/bin/omniedge"
          
          # Copy init script
          if [ -f "openwrt/files/omniedge.init" ]; then
            cp openwrt/files/omniedge.init "${PKG_DIR}/data/etc/init.d/omniedge"
            chmod 755 "${PKG_DIR}/data/etc/init.d/omniedge"
          fi
          
          # Copy config
          if [ -f "openwrt/files/omniedge.config" ]; then
            cp openwrt/files/omniedge.config "${PKG_DIR}/data/etc/config/omniedge"
          fi
          
          # Calculate installed size
          INSTALLED_SIZE=$(du -sb "${PKG_DIR}/data" | cut -f1)
          
          # Create control file
          cat > "${PKG_DIR}/control/control" << EOF
          Package: omniedge
          Version: ${VERSION}
          Depends: libc, kmod-tun
          Source: https://github.com/omniedgeio/omniedge
          Section: net
          SourceName: omniedge
          License: Apache-2.0 OR MIT
          Architecture: ${PKG_ARCH}
          Installed-Size: ${INSTALLED_SIZE}
          Maintainer: OmniEdge Team <support@omniedge.io>
          Description: OmniEdge - Peer-to-peer VPN for edge computing
           A secure, peer-to-peer mesh VPN solution for connecting devices
           across networks with minimal latency and maximum security.
          EOF
          
          # Create postinst script
          cat > "${PKG_DIR}/control/postinst" << 'EOF'
          #!/bin/sh
          [ -x /etc/init.d/omniedge ] && /etc/init.d/omniedge enable
          exit 0
          EOF
          chmod 755 "${PKG_DIR}/control/postinst"
          
          # Create prerm script
          cat > "${PKG_DIR}/control/prerm" << 'EOF'
          #!/bin/sh
          [ -x /etc/init.d/omniedge ] && /etc/init.d/omniedge disable
          [ -x /etc/init.d/omniedge ] && /etc/init.d/omniedge stop
          exit 0
          EOF
          chmod 755 "${PKG_DIR}/control/prerm"
          
          # Create conffiles
          echo "/etc/config/omniedge" > "${PKG_DIR}/control/conffiles"
          
          # Build IPK package
          cd "${PKG_DIR}/control"
          tar --numeric-owner --group=0 --owner=0 -czf ../control.tar.gz .
          cd ../data
          tar --numeric-owner --group=0 --owner=0 -czf ../data.tar.gz .
          cd ..
          echo "2.0" > debian-binary
          tar --numeric-owner --group=0 --owner=0 -czf "../omniedge-${VERSION}-openwrt-${{ matrix.cli_arch }}.ipk" \
            ./debian-binary ./control.tar.gz ./data.tar.gz
          cd ..
          
          ls -lh "omniedge-${VERSION}-openwrt-${{ matrix.cli_arch }}.ipk"

      - name: Create APK package
        if: matrix.pkg_format == 'apk'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PKG_ARCH="${{ matrix.openwrt_arch }}"
          
          # Create package directory structure
          PKG_DIR="omniedge-${VERSION}"
          mkdir -p "${PKG_DIR}/usr/bin"
          mkdir -p "${PKG_DIR}/etc/init.d"
          mkdir -p "${PKG_DIR}/etc/config"
          
          # Copy binary
          cp omniedge-binary "${PKG_DIR}/usr/bin/omniedge"
          chmod 755 "${PKG_DIR}/usr/bin/omniedge"
          
          # Copy init script
          if [ -f "openwrt/files/omniedge.init" ]; then
            cp openwrt/files/omniedge.init "${PKG_DIR}/etc/init.d/omniedge"
            chmod 755 "${PKG_DIR}/etc/init.d/omniedge"
          fi
          
          # Copy config
          if [ -f "openwrt/files/omniedge.config" ]; then
            cp openwrt/files/omniedge.config "${PKG_DIR}/etc/config/omniedge"
          fi
          
          # Create .PKGINFO for APK
          cat > "${PKG_DIR}/.PKGINFO" << EOF
          pkgname = omniedge
          pkgver = ${VERSION}-r1
          pkgdesc = OmniEdge - Peer-to-peer VPN for edge computing
          url = https://omniedge.io
          builddate = $(date +%s)
          packager = OmniEdge Team <support@omniedge.io>
          size = $(du -sb "${PKG_DIR}/usr/bin/omniedge" | cut -f1)
          arch = ${PKG_ARCH}
          license = Apache-2.0 OR MIT
          depend = kmod-tun
          EOF
          
          # Create the APK tarball (unsigned, for manual installation)
          cd "${PKG_DIR}"
          tar -czf "../omniedge-${VERSION}-openwrt-${{ matrix.cli_arch }}.apk" \
            .PKGINFO usr etc 2>/dev/null || \
          tar -czf "../omniedge-${VERSION}-openwrt-${{ matrix.cli_arch }}.apk" \
            .PKGINFO usr
          cd ..
          
          ls -lh "omniedge-${VERSION}-openwrt-${{ matrix.cli_arch }}.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniedge-openwrt-${{ steps.version.outputs.version }}-${{ matrix.cli_arch }}-${{ matrix.pkg_format }}
          path: omniedge-*-openwrt-*.${{ matrix.pkg_format }}

      - name: Upload to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          file: omniedge-*-openwrt-*.${{ matrix.pkg_format }}
          tag: ${{ github.ref }}
          overwrite: true

  # ===========================================================================
  # Release Summary - Final job that downstream workflows wait for
  # ===========================================================================
  release-summary:
    name: Release Summary
    runs-on: ubuntu-latest
    needs: [prepare-release, build-cli, build-desktop, build-openwrt]
    if: always() && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Generate summary
        run: |
          echo "## Release ${{ github.ref_name }} Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### CLI Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Architecture | Formats |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Linux | x64 | .tar.gz, .deb, .rpm, .AppImage |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux | arm64 | .tar.gz, .deb, .rpm |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux | riscv64 | .tar.gz |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | x64 | .tar.gz |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | arm64 | .tar.gz |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows | x64 | .zip |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Desktop Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Architecture | Formats |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| Linux | x64 | .deb, .rpm, .AppImage |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | x64 | .dmg |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | arm64 | .dmg |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows | x64 | .msi, -setup.exe |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### OpenWrt Packages" >> $GITHUB_STEP_SUMMARY
          echo "| Architecture | IPK (24.10.x) | APK (25.x) |" >> $GITHUB_STEP_SUMMARY
          echo "|--------------|---------------|------------|" >> $GITHUB_STEP_SUMMARY
          echo "| x86_64 | .ipk | .apk |" >> $GITHUB_STEP_SUMMARY
          echo "| aarch64 | .ipk | .apk |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifact Naming Convention" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "omniedge-cli-{version}-{platform}-{arch}.{ext}" >> $GITHUB_STEP_SUMMARY
          echo "omniedge-desktop-{version}-{platform}-{arch}.{ext}" >> $GITHUB_STEP_SUMMARY
          echo "omniedge-{version}-openwrt-{arch}.{ipk|apk}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Publish Packages - Update package managers with new release
  # ===========================================================================
  publish-packages:
    name: Publish Packages
    runs-on: ubuntu-latest
    needs: [prepare-release, build-cli, build-desktop, release-summary]
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-beta') && !contains(github.ref, '-rc')
    steps:
      - name: Check required secrets
        id: check_secrets
        run: |
          SECRETS_CONFIGURED=false
          
          if [ -n "${{ secrets.HOMEBREW_TAP_TOKEN }}" ]; then
            echo "homebrew=true" >> $GITHUB_OUTPUT
            SECRETS_CONFIGURED=true
          else
            echo "homebrew=false" >> $GITHUB_OUTPUT
            echo "::notice::HOMEBREW_TAP_TOKEN not configured, skipping Homebrew publish"
          fi
          
          if [ -n "${{ secrets.AUR_SSH_PRIVATE_KEY }}" ]; then
            echo "aur=true" >> $GITHUB_OUTPUT
            SECRETS_CONFIGURED=true
          else
            echo "aur=false" >> $GITHUB_OUTPUT
            echo "::notice::AUR_SSH_PRIVATE_KEY not configured, skipping AUR publish"
          fi
          
          if [ -n "${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}" ]; then
            echo "snap=true" >> $GITHUB_OUTPUT
            SECRETS_CONFIGURED=true
          else
            echo "snap=false" >> $GITHUB_OUTPUT
            echo "::notice::SNAPCRAFT_STORE_CREDENTIALS not configured, skipping Snap publish"
          fi
          
          if [ "$SECRETS_CONFIGURED" = "false" ]; then
            echo "::notice::No publishing secrets configured, skipping all package publishing"
            echo "skip_all=true" >> $GITHUB_OUTPUT
          else
            echo "skip_all=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.check_secrets.outputs.skip_all != 'true'

      - name: Get version and checksums
        if: steps.check_secrets.outputs.skip_all != 'true'
        id: info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}"
          
          # Function to get SHA256
          get_sha256() {
            local url="$1"
            local name="$2"
            if curl -fsSL -o "$name" "$url" 2>/dev/null; then
              sha256sum "$name" | cut -d' ' -f1
            else
              echo "UNAVAILABLE"
            fi
          }
          
          # CLI checksums
          echo "cli_linux_x64=$(get_sha256 "${BASE_URL}/omniedge-cli-${VERSION}-linux-x64.tar.gz" "cli-linux-x64.tar.gz")" >> $GITHUB_OUTPUT
          echo "cli_linux_arm64=$(get_sha256 "${BASE_URL}/omniedge-cli-${VERSION}-linux-arm64.tar.gz" "cli-linux-arm64.tar.gz")" >> $GITHUB_OUTPUT
          echo "cli_macos_x64=$(get_sha256 "${BASE_URL}/omniedge-cli-${VERSION}-macos-x64.tar.gz" "cli-macos-x64.tar.gz")" >> $GITHUB_OUTPUT
          echo "cli_macos_arm64=$(get_sha256 "${BASE_URL}/omniedge-cli-${VERSION}-macos-arm64.tar.gz" "cli-macos-arm64.tar.gz")" >> $GITHUB_OUTPUT
          echo "cli_windows_x64=$(get_sha256 "${BASE_URL}/omniedge-cli-${VERSION}-windows-x64.zip" "cli-windows-x64.zip")" >> $GITHUB_OUTPUT
          
          # Desktop checksums
          echo "desktop_macos_x64=$(get_sha256 "${BASE_URL}/omniedge-desktop-${VERSION}-macos-x64.dmg" "desktop-macos-x64.dmg")" >> $GITHUB_OUTPUT
          echo "desktop_macos_arm64=$(get_sha256 "${BASE_URL}/omniedge-desktop-${VERSION}-macos-arm64.dmg" "desktop-macos-arm64.dmg")" >> $GITHUB_OUTPUT
          echo "desktop_windows_msi=$(get_sha256 "${BASE_URL}/omniedge-desktop-${VERSION}-windows-x64.msi" "desktop-windows-msi.msi")" >> $GITHUB_OUTPUT

      # ---- Homebrew ----
      - name: Update Homebrew Formula
        env:
          VERSION: ${{ steps.info.outputs.version }}
          SHA256_MACOS_ARM64: ${{ steps.info.outputs.cli_macos_arm64 }}
          SHA256_MACOS_X64: ${{ steps.info.outputs.cli_macos_x64 }}
          SHA256_LINUX_ARM64: ${{ steps.info.outputs.cli_linux_arm64 }}
          SHA256_LINUX_X64: ${{ steps.info.outputs.cli_linux_x64 }}
        run: |
          if [ -f "packaging/homebrew/Formula/omniedge-cli.rb" ]; then
            sed -i "s/version \".*\"/version \"${VERSION}\"/" packaging/homebrew/Formula/omniedge-cli.rb
            sed -i "s/PLACEHOLDER_SHA256_MACOS_ARM64/${SHA256_MACOS_ARM64}/" packaging/homebrew/Formula/omniedge-cli.rb
            sed -i "s/PLACEHOLDER_SHA256_MACOS_X64/${SHA256_MACOS_X64}/" packaging/homebrew/Formula/omniedge-cli.rb
            sed -i "s/PLACEHOLDER_SHA256_LINUX_ARM64/${SHA256_LINUX_ARM64}/" packaging/homebrew/Formula/omniedge-cli.rb
            sed -i "s/PLACEHOLDER_SHA256_LINUX_X64/${SHA256_LINUX_X64}/" packaging/homebrew/Formula/omniedge-cli.rb
            echo "Updated Homebrew formula for version ${VERSION}"
          else
            echo "No Homebrew formula found, skipping"
          fi

      - name: Push to Homebrew Tap
        if: steps.check_secrets.outputs.homebrew == 'true' && vars.HOMEBREW_TAP_REPO != ''
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${{ vars.HOMEBREW_TAP_REPO }}.git" tap
          cp packaging/homebrew/Formula/*.rb tap/Formula/
          cp packaging/homebrew/Casks/*.rb tap/Casks/ 2>/dev/null || true
          cd tap
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Update to version ${{ steps.info.outputs.version }}" || echo "No changes to commit"
          git push

      # ---- AUR ----
      - name: Update AUR PKGBUILD
        env:
          VERSION: ${{ steps.info.outputs.version }}
          SHA256_X64: ${{ steps.info.outputs.cli_linux_x64 }}
          SHA256_ARM64: ${{ steps.info.outputs.cli_linux_arm64 }}
        run: |
          if [ -f "packaging/aur/omniedge-cli-bin/PKGBUILD" ]; then
            cd packaging/aur/omniedge-cli-bin
            sed -i "s/pkgver=.*/pkgver=${VERSION}/" PKGBUILD
            sed -i "s/PLACEHOLDER_SHA256_X64/${SHA256_X64}/" PKGBUILD
            sed -i "s/PLACEHOLDER_SHA256_ARM64/${SHA256_ARM64}/" PKGBUILD
            echo "Updated AUR PKGBUILD for version ${VERSION}"
          else
            echo "No AUR PKGBUILD found, skipping"
          fi

      - name: Publish to AUR
        if: steps.check_secrets.outputs.aur == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@v2
        with:
          pkgname: omniedge-cli-bin
          pkgbuild: packaging/aur/omniedge-cli-bin/PKGBUILD
          commit_username: GitHub Actions
          commit_email: actions@github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to version ${{ steps.info.outputs.version }}"

      # ---- Snap ----
      - name: Update Snap version
        run: |
          if [ -f "packaging/snap/snapcraft.yaml" ]; then
            sed -i "s/version: .*/version: '${{ steps.info.outputs.version }}'/" packaging/snap/snapcraft.yaml
            echo "Updated snapcraft.yaml for version ${{ steps.info.outputs.version }}"
          else
            echo "No snapcraft.yaml found, skipping"
          fi

      - name: Build Snap
        if: steps.check_secrets.outputs.snap == 'true' && hashFiles('packaging/snap/snapcraft.yaml') != ''
        uses: snapcore/action-build@v1
        id: build_snap
        with:
          path: packaging/snap

      - name: Publish to Snap Store
        if: steps.check_secrets.outputs.snap == 'true' && steps.build_snap.outputs.snap != ''
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build_snap.outputs.snap }}
          release: stable

      - name: Publish summary
        run: |
          echo "## Package Publishing Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version: ${{ steps.info.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Checksums" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | SHA256 |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| CLI Linux x64 | \`${{ steps.info.outputs.cli_linux_x64 }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| CLI Linux arm64 | \`${{ steps.info.outputs.cli_linux_arm64 }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| CLI macOS x64 | \`${{ steps.info.outputs.cli_macos_x64 }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| CLI macOS arm64 | \`${{ steps.info.outputs.cli_macos_arm64 }}\` |" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Publish Windows Packages - Winget and Chocolatey
  # ===========================================================================
  publish-windows-packages:
    name: Publish Windows Packages
    runs-on: windows-latest
    needs: [prepare-release, build-cli, build-desktop, release-summary]
    if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref, '-beta') && !contains(github.ref, '-rc')
    steps:
      - name: Check required secrets
        id: check_secrets
        shell: bash
        run: |
          SECRETS_CONFIGURED=false
          
          if [ -n "${{ secrets.WINGET_TOKEN }}" ]; then
            echo "winget=true" >> $GITHUB_OUTPUT
            SECRETS_CONFIGURED=true
          else
            echo "winget=false" >> $GITHUB_OUTPUT
            echo "::notice::WINGET_TOKEN not configured, skipping Winget publish"
          fi
          
          if [ -n "${{ secrets.CHOCOLATEY_API_KEY }}" ]; then
            echo "chocolatey=true" >> $GITHUB_OUTPUT
            SECRETS_CONFIGURED=true
          else
            echo "chocolatey=false" >> $GITHUB_OUTPUT
            echo "::notice::CHOCOLATEY_API_KEY not configured, skipping Chocolatey publish"
          fi
          
          if [ "$SECRETS_CONFIGURED" = "false" ]; then
            echo "::notice::No Windows publishing secrets configured, skipping all Windows package publishing"
            echo "skip_all=true" >> $GITHUB_OUTPUT
          else
            echo "skip_all=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.check_secrets.outputs.skip_all != 'true'

      - name: Get version and checksums
        if: steps.check_secrets.outputs.skip_all != 'true'
        id: info
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.prepare-release.outputs.version }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}"
          
          # CLI checksum
          curl -fsSL -o cli.zip "${BASE_URL}/omniedge-cli-${VERSION}-windows-x64.zip" 2>/dev/null && \
            echo "cli_windows_x64=$(sha256sum cli.zip | cut -d' ' -f1)" >> $GITHUB_OUTPUT || \
            echo "cli_windows_x64=UNAVAILABLE" >> $GITHUB_OUTPUT
          
          # Desktop MSI checksum
          curl -fsSL -o desktop.msi "${BASE_URL}/omniedge-desktop-${VERSION}-windows-x64.msi" 2>/dev/null && \
            echo "desktop_windows_msi=$(sha256sum desktop.msi | cut -d' ' -f1)" >> $GITHUB_OUTPUT || \
            echo "desktop_windows_msi=UNAVAILABLE" >> $GITHUB_OUTPUT

      # ---- Winget ----
      - name: Update Winget Manifests
        if: steps.check_secrets.outputs.skip_all != 'true'
        shell: pwsh
        env:
          VERSION: ${{ steps.info.outputs.version }}
          SHA256_CLI: ${{ steps.info.outputs.cli_windows_x64 }}
          SHA256_DESKTOP: ${{ steps.info.outputs.desktop_windows_msi }}
        run: |
          # Update CLI manifest files
          if (Test-Path "packaging/winget/omniedge-cli") {
            $version = $env:VERSION
            
            # Update version manifest
            $versionYaml = Get-Content "packaging/winget/omniedge-cli/OmniEdge.OmniEdgeCLI.yaml" -Raw
            $versionYaml = $versionYaml -replace "PackageVersion: .*", "PackageVersion: $version"
            Set-Content "packaging/winget/omniedge-cli/OmniEdge.OmniEdgeCLI.yaml" $versionYaml
            
            # Update installer manifest
            $installerYaml = Get-Content "packaging/winget/omniedge-cli/OmniEdge.OmniEdgeCLI.installer.yaml" -Raw
            $installerYaml = $installerYaml -replace "PackageVersion: .*", "PackageVersion: $version"
            $installerYaml = $installerYaml -replace "PLACEHOLDER_SHA256", "$env:SHA256_CLI"
            $installerYaml = $installerYaml -replace "omniedge-cli-[\d\.]+(-windows-x64\.exe)", "omniedge-cli-$version-windows-x64.exe"
            $installerYaml = $installerYaml -replace "download/v[\d\.]+/", "download/v$version/"
            Set-Content "packaging/winget/omniedge-cli/OmniEdge.OmniEdgeCLI.installer.yaml" $installerYaml
            
            # Update locale manifest
            $localeYaml = Get-Content "packaging/winget/omniedge-cli/OmniEdge.OmniEdgeCLI.locale.en-US.yaml" -Raw
            $localeYaml = $localeYaml -replace "PackageVersion: .*", "PackageVersion: $version"
            $localeYaml = $localeYaml -replace "releases/tag/v[\d\.]+", "releases/tag/v$version"
            Set-Content "packaging/winget/omniedge-cli/OmniEdge.OmniEdgeCLI.locale.en-US.yaml" $localeYaml
            
            Write-Host "Updated Winget CLI manifests for version $version"
          }
          
          # Update Desktop manifest files
          if (Test-Path "packaging/winget/omniedge-desktop") {
            $version = $env:VERSION
            
            # Update version manifest
            $versionYaml = Get-Content "packaging/winget/omniedge-desktop/OmniEdge.OmniEdgeDesktop.yaml" -Raw
            $versionYaml = $versionYaml -replace "PackageVersion: .*", "PackageVersion: $version"
            Set-Content "packaging/winget/omniedge-desktop/OmniEdge.OmniEdgeDesktop.yaml" $versionYaml
            
            # Update installer manifest
            $installerYaml = Get-Content "packaging/winget/omniedge-desktop/OmniEdge.OmniEdgeDesktop.installer.yaml" -Raw
            $installerYaml = $installerYaml -replace "PackageVersion: .*", "PackageVersion: $version"
            $installerYaml = $installerYaml -replace "PLACEHOLDER_SHA256_MSI", "$env:SHA256_DESKTOP"
            $installerYaml = $installerYaml -replace "omniedge-desktop-[\d\.]+(-windows-x64\.msi)", "omniedge-desktop-$version-windows-x64.msi"
            $installerYaml = $installerYaml -replace "download/v[\d\.]+/", "download/v$version/"
            Set-Content "packaging/winget/omniedge-desktop/OmniEdge.OmniEdgeDesktop.installer.yaml" $installerYaml
            
            # Update locale manifest
            $localeYaml = Get-Content "packaging/winget/omniedge-desktop/OmniEdge.OmniEdgeDesktop.locale.en-US.yaml" -Raw
            $localeYaml = $localeYaml -replace "PackageVersion: .*", "PackageVersion: $version"
            $localeYaml = $localeYaml -replace "releases/tag/v[\d\.]+", "releases/tag/v$version"
            Set-Content "packaging/winget/omniedge-desktop/OmniEdge.OmniEdgeDesktop.locale.en-US.yaml" $localeYaml
            
            Write-Host "Updated Winget Desktop manifests for version $version"
          }

      - name: Submit to Winget via wingetcreate
        if: steps.check_secrets.outputs.winget == 'true'
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          # Install wingetcreate
          Invoke-WebRequest -Uri "https://aka.ms/wingetcreate/latest" -OutFile "wingetcreate.exe"
          
          $version = $env:VERSION
          $cliUrl = "https://github.com/${{ github.repository }}/releases/download/v$version/omniedge-cli-$version-windows-x64.zip"
          $desktopUrl = "https://github.com/${{ github.repository }}/releases/download/v$version/omniedge-desktop-$version-windows-x64.msi"
          
          # Submit CLI package (update if exists, otherwise skip - first version must be manual)
          Write-Host "Submitting OmniEdge CLI to winget-pkgs..."
          try {
            ./wingetcreate.exe update OmniEdge.OmniEdgeCLI `
              --urls $cliUrl `
              --version $version `
              --token $env:WINGET_TOKEN `
              --submit
            Write-Host "CLI package submitted successfully"
          } catch {
            Write-Host "::warning::Failed to submit CLI package. If this is the first version, submit manually first."
            Write-Host $_.Exception.Message
          }
          
          # Submit Desktop package (update if exists, otherwise skip - first version must be manual)
          Write-Host "Submitting OmniEdge Desktop to winget-pkgs..."
          try {
            ./wingetcreate.exe update OmniEdge.OmniEdgeDesktop `
              --urls $desktopUrl `
              --version $version `
              --token $env:WINGET_TOKEN `
              --submit
            Write-Host "Desktop package submitted successfully"
          } catch {
            Write-Host "::warning::Failed to submit Desktop package. If this is the first version, submit manually first."
            Write-Host $_.Exception.Message
          }

      # ---- Chocolatey ----
      - name: Update Chocolatey Packages
        shell: pwsh
        env:
          VERSION: ${{ steps.info.outputs.version }}
          SHA256_CLI: ${{ steps.info.outputs.cli_windows_x64 }}
          SHA256_DESKTOP: ${{ steps.info.outputs.desktop_windows_msi }}
        run: |
          # Update CLI package
          if (Test-Path "packaging/chocolatey/omniedge-cli/omniedge-cli.nuspec") {
            $nuspec = Get-Content "packaging/chocolatey/omniedge-cli/omniedge-cli.nuspec" -Raw
            $nuspec = $nuspec -replace "<version>.*</version>", "<version>$env:VERSION</version>"
            $nuspec = $nuspec -replace "v2\.0\.0", "v$env:VERSION"
            Set-Content "packaging/chocolatey/omniedge-cli/omniedge-cli.nuspec" $nuspec
            
            $install = Get-Content "packaging/chocolatey/omniedge-cli/tools/chocolateyInstall.ps1" -Raw
            $install = $install -replace "\`$version = '.*'", "`$version = '$env:VERSION'"
            $install = $install -replace "PLACEHOLDER_SHA256", "$env:SHA256_CLI"
            Set-Content "packaging/chocolatey/omniedge-cli/tools/chocolateyInstall.ps1" $install
            Write-Host "Updated Chocolatey CLI package"
          }
          
          # Update Desktop package
          if (Test-Path "packaging/chocolatey/omniedge-desktop/omniedge-desktop.nuspec") {
            $nuspec = Get-Content "packaging/chocolatey/omniedge-desktop/omniedge-desktop.nuspec" -Raw
            $nuspec = $nuspec -replace "<version>.*</version>", "<version>$env:VERSION</version>"
            $nuspec = $nuspec -replace "v2\.0\.0", "v$env:VERSION"
            Set-Content "packaging/chocolatey/omniedge-desktop/omniedge-desktop.nuspec" $nuspec
            
            $install = Get-Content "packaging/chocolatey/omniedge-desktop/tools/chocolateyInstall.ps1" -Raw
            $install = $install -replace "\`$version = '.*'", "`$version = '$env:VERSION'"
            $install = $install -replace "PLACEHOLDER_SHA256", "$env:SHA256_DESKTOP"
            Set-Content "packaging/chocolatey/omniedge-desktop/tools/chocolateyInstall.ps1" $install
            Write-Host "Updated Chocolatey Desktop package"
          }

      - name: Build and Push CLI Chocolatey Package
        if: steps.check_secrets.outputs.chocolatey == 'true'
        shell: pwsh
        run: |
          if (Test-Path "packaging/chocolatey/omniedge-cli/omniedge-cli.nuspec") {
            cd packaging/chocolatey/omniedge-cli
            choco pack
            choco push omniedge-cli.${{ steps.info.outputs.version }}.nupkg --source https://push.chocolatey.org/ --api-key ${{ secrets.CHOCOLATEY_API_KEY }}
          }

      - name: Build and Push Desktop Chocolatey Package
        if: steps.check_secrets.outputs.chocolatey == 'true'
        shell: pwsh
        run: |
          if (Test-Path "packaging/chocolatey/omniedge-desktop/omniedge-desktop.nuspec") {
            cd packaging/chocolatey/omniedge-desktop
            choco pack
            choco push omniedge-desktop.${{ steps.info.outputs.version }}.nupkg --source https://push.chocolatey.org/ --api-key ${{ secrets.CHOCOLATEY_API_KEY }}
          }

  # ===========================================================================
  # Notify Dependent Repositories
  # ===========================================================================
  notify-dependent-repos:
    name: Notify Dependent Repos
    runs-on: ubuntu-latest
    needs: [prepare-release, build-cli, build-desktop, release-summary]
    # Only notify for stable releases (not beta/rc)
    if: |
      startsWith(github.ref, 'refs/tags/') &&
      !contains(github.ref, '-beta') &&
      !contains(github.ref, '-rc')
    steps:
      - name: Check secret
        id: check_secret
        run: |
          if [ -n "${{ secrets.REPO_DISPATCH_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::notice::REPO_DISPATCH_TOKEN not configured, skipping notifications"
          fi

      - name: Get version info
        if: steps.check_secret.outputs.has_token == 'true'
        id: version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Trigger omniedge-docker
        if: steps.check_secret.outputs.has_token == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}
          repository: omniedgeio/omniedge-docker
          event-type: cli-release
          client-payload: '{"version": "${{ steps.version.outputs.version }}", "tag": "${{ steps.version.outputs.tag }}"}'

      - name: Trigger omniedge-openwrt
        if: steps.check_secret.outputs.has_token == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}
          repository: omniedgeio/omniedge-openwrt
          event-type: cli-release
          client-payload: '{"version": "${{ steps.version.outputs.version }}", "tag": "${{ steps.version.outputs.tag }}"}'

      - name: Trigger omniedge-synology
        if: steps.check_secret.outputs.has_token == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}
          repository: omniedgeio/omniedge-synology
          event-type: cli-release
          client-payload: '{"version": "${{ steps.version.outputs.version }}", "tag": "${{ steps.version.outputs.tag }}"}'

      - name: Trigger github-action
        if: steps.check_secret.outputs.has_token == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}
          repository: omniedgeio/github-action
          event-type: cli-release
          client-payload: '{"version": "${{ steps.version.outputs.version }}", "tag": "${{ steps.version.outputs.tag }}"}'

      - name: Trigger omniedge-web-frontend
        if: steps.check_secret.outputs.has_token == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}
          repository: omniedgeio/omniedge-web-frontend
          event-type: release
          client-payload: '{"version": "${{ steps.version.outputs.version }}", "tag": "${{ steps.version.outputs.tag }}"}'

      - name: Summary
        if: steps.check_secret.outputs.has_token == 'true'
        run: |
          echo "## Triggered Dependency Updates" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Version: **${{ steps.version.outputs.tag }}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Notified repositories:" >> $GITHUB_STEP_SUMMARY
          echo "- omniedge-docker" >> $GITHUB_STEP_SUMMARY
          echo "- omniedge-openwrt" >> $GITHUB_STEP_SUMMARY
          echo "- omniedge-synology" >> $GITHUB_STEP_SUMMARY
          echo "- github-action" >> $GITHUB_STEP_SUMMARY
          echo "- omniedge-web-frontend" >> $GITHUB_STEP_SUMMARY
