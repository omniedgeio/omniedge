name: omniedge-cli
base: core22
version: '2.0.0'
summary: Peer-to-peer VPN CLI for edge computing
description: |
  OmniEdge CLI is a command-line tool for creating secure, peer-to-peer mesh 
  VPN connections. It enables devices to communicate directly across networks 
  with minimal latency and maximum security.

  Features:
  - Peer-to-peer connections without central relay
  - Automatic mesh network topology
  - Built on WireGuard protocol
  - Cross-platform support
  - Simple CLI interface

  Get started:
    omniedge login
    omniedge join

grade: stable
confinement: classic  # VPN requires full system access for TUN/TAP

architectures:
  - build-on: amd64
  - build-on: arm64

parts:
  omniedge:
    plugin: rust
    source: .
    source-type: local
    rust-path: [crates/omni-cli]
    build-packages:
      - build-essential
      - pkg-config
      - libssl-dev
    stage-packages:
      - libssl3
      - ca-certificates
    override-build: |
      cd $SNAPCRAFT_PART_SRC
      cargo build --release -p omniedge-cli
      mkdir -p $SNAPCRAFT_PART_INSTALL/bin
      cp target/release/omniedge $SNAPCRAFT_PART_INSTALL/bin/

apps:
  omniedge:
    command: bin/omniedge
    # Classic confinement - no plugs needed as we have full system access
