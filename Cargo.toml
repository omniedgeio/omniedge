[workspace]
members = [
    "crates/omni-api",
    "crates/omni-proto",
    "crates/omni-tun",
    "crates/omni-cli",
    "crates/omni-core",
    "ui/desktop/src-tauri", "crates/omni-helper",
]
resolver = "2"

# NOTE: Uncomment for local development with OmniNervous
[patch."https://github.com/omniedgeio/OmniNervous"]
omninervous = { path = "../OmniNervous/crates/daemon" }
