[package]
name = "omni-proto"
version = "2.5.0"
edition = "2021"
license = "Apache-2.0 OR MIT"

[dependencies]
# For development: use local OmniNervous
# omninervous = { path = "../../../OmniNervous/crates/daemon", package = "omninervous" }
# For release: use git tag
omninervous = { git = "https://github.com/omniedgeio/OmniNervous", package = "omninervous", tag = "v0.9.3" }
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_cbor = "0.11"
log = "0.4"
