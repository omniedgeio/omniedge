[package]
name = "omni-core"
version = "2.5.0"
edition = "2021"
license = "Apache-2.0 OR MIT"

[features]
default = []
# L2 VPN support (TAP-based Ethernet bridging) - Linux only
l2-vpn = ["omni-tun/l2-vpn"]
# Self-update functionality (requires additional dependencies)
updater = ["zip", "flate2", "tar", "walkdir"]

[dependencies]
omni-api = { path = "../omni-api" }
tokio-tungstenite = { version = "0.20", features = ["rustls-tls-native-roots"] }
url = "2.4"
futures-util = "0.3"
omni-proto = { path = "../omni-proto" }
omni-tun = { path = "../omni-tun" }
# For development: use local OmniNervous
# omninervous = { path = "../../../OmniNervous/crates/daemon", package = "omninervous" }
# For release: use git tag
omninervous = { git = "https://github.com/omniedgeio/OmniNervous", package = "omninervous", tag = "v0.8.0" }
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
hex = "0.4"
thiserror = "1.0"
dirs = "5.0"
whoami = "1.5.0"
dotenvy = "0.15"
socket2 = { version = "0.5", features = ["all"] }
futures = "0.3"
rand = "0.8"  # For disco transaction ID generation
# Updater dependencies
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "stream"] }
# Optional dependencies for self-update
zip = { version = "0.6", optional = true }
flate2 = { version = "1.0", optional = true }
tar = { version = "0.4", optional = true }
walkdir = { version = "2.4", optional = true }
