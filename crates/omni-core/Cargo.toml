[package]
name = "omni-core"
version = "2.0.0"
edition = "2021"
license = "Apache-2.0 OR MIT"

[dependencies]
omni-api = { path = "../omni-api" }
tokio-tungstenite = { version = "0.20", features = ["rustls-tls-native-roots"] }
url = "2.4"
futures-util = "0.3"
omni-proto = { path = "../omni-proto" }
omni-tun = { path = "../omni-tun" }
omninervous = { git = "https://github.com/omniedgeio/OmniNervous", package = "omninervous", tag = "v0.3.1" }
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
hex = "0.4"
thiserror = "1.0"
dirs = "5.0"
whoami = "1.5.0"
dotenvy = "0.15"
