[package]
name = "omniedge-cli"
version = "2.5.0"
edition = "2021"
license = "Apache-2.0 OR MIT"

[[bin]]
name = "omniedge"
path = "src/main.rs"

[features]
default = ["wasm-plugins", "updater"]
# WASM plugin support - disabled on architectures without Cranelift support (MIPS)
wasm-plugins = ["dep:omni-plugin"]
# L2 VPN support (TAP-based Ethernet bridging) - Linux only
l2-vpn = ["omni-core/l2-vpn"]
# Self-update functionality
updater = ["omni-core/updater"]
# SSH integration (server, client, SFTP)
ssh = ["dep:omni-ssh"]

[dependencies]
omni-api = { path = "../omni-api" }
omni-proto = { path = "../omni-proto" }
omni-tun = { path = "../omni-tun" }
omni-core = { path = "../omni-core" }
omni-plugin = { path = "../omni-plugin", optional = true }
omni-ssh = { path = "../omni-ssh", features = ["sftp"], optional = true }
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
log = "0.4"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
whoami = "1.4"
flexi_logger = "0.27"
dotenvy = "0.15"
machineid-rs = "1.2"
uuid = { version = "1.0", features = ["v4"] }
hex = "0.4"
base64 = "0.21"
network-interface = "1.1"
mac_address = "1.1"
local-ip-address = "0.5"
regex = "1.10"
ipnetwork = "0.20"
ipnet = "2"
is_elevated = "0.1"
indicatif = "0.17"

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["user"] }
