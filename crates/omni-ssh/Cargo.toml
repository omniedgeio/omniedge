[package]
name = "omni-ssh"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "SSH server and client for OmniEdge VPN"
authors = ["OmniEdge Team"]
repository = "https://github.com/omniedgeio/omniedge"

[features]
default = ["server", "client"]
server = []
client = []
sftp = ["russh-sftp"]
recording = []
fleet = []
emergency = []

[dependencies]
# SSH Protocol
russh = "0.44"
russh-keys = "0.44"
russh-sftp = { version = "2.0", optional = true }

# From OmniEdge workspace
omni-api = { path = "../omni-api" }
omni-core = { path = "../omni-core" }
omni-proto = { path = "../omni-proto" }

# Async runtime
tokio = { version = "1", features = ["full", "process"] }
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"

# Time & UUID
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Concurrency
dashmap = "5"
parking_lot = "0.12"

# Regex for command filtering
regex = "1"

# IP network matching
ipnet = "2"

# HTTP client for cloud API
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# Cryptography for recording integrity
ring = "0.17"
base64 = "0.21"
sha2 = "0.10"

# Directory utilities
dirs = "5"

# Cross-platform PTY
portable-pty = "0.8"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["user", "process", "signal"] }
libc = "0.2"
# User/group lookup (Unix only)
users = "0.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.52", features = [
    "Win32_System_Console",
    "Win32_Security",
    "Win32_System_Threading",
] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
