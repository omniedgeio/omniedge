[package]
name = "omni-plugin"
version = "2.2.1"
edition = "2021"
license = "Apache-2.0 OR MIT"
description = "Plugin system for OmniEdge - WASM-based extensibility"
readme = "README.md"

[dependencies]
# WASM Runtime
wasmtime = { version = "18", features = ["component-model"] }
wasmtime-wasi = "18"

# Async runtime
tokio = { version = "1.0", features = ["full", "sync", "time"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"
tracing = "0.1"

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
dirs = "5.0"
zip = "0.6"
parking_lot = "0.12"

# Async traits
async-trait = "0.1"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"

[features]
default = []
# Enable widget support for UI plugins
widgets = []
# Enable robotics data collection plugins (Phase 0 - core types only)
robotics = []
# Enable full robotics support with all dependencies
robotics-full = ["robotics"]
