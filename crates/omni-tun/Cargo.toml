[package]
name = "omni-tun"
version = "2.5.0"
edition = "2021"
license = "Apache-2.0 OR MIT"

[features]
default = []
# L2 VPN support (TAP-based Ethernet bridging) - Linux only
# This enables the OmniNervous L2 module for Layer 2 networking
l2-vpn = []

[dependencies]
# For development: use local OmniNervous
# omninervous = { path = "../../../OmniNervous/crates/daemon", package = "omninervous" }

omninervous = { git = "https://github.com/omniedgeio/OmniNervous", package = "omninervous", tag = "v1.0.0" }
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
log = "0.4"

[target.'cfg(windows)'.dependencies]
wintun = "0.3"
