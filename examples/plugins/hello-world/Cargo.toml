[package]
name = "hello-world-plugin"
version = "0.1.0"
edition = "2021"
description = "Example OmniEdge event plugin that logs VPN lifecycle events"
license = "Apache-2.0"
publish = false

# This plugin is a standalone crate, not part of the workspace
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# wit-bindgen generates Rust bindings from WIT interfaces
wit-bindgen = "0.36"

[package.metadata.component]
package = "omniedge:hello-world"

[package.metadata.component.target]
path = "wit"
world = "event-plugin-world"
